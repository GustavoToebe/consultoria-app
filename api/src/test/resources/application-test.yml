spring:
  datasource:
    hikari:
      # A suíte guarda vários contextos do Spring ao mesmo tempo (cada combinação de configuração é um), todos no mesmo Postgres
      # de teste (max_connections 100). Com o pool de produção (10) o mvn verify local estourava as conexões; 3 com nenhuma
      # ociosa por padrão sobra para o teste e deixa o Postgres respirar.
      maximum-pool-size: 3
      minimum-idle: 0
# Segredo só desta suíte. O valor decodifica para 37 bytes; não serve fora do teste.
plataforma:
  auth:
    jwt:
      secret: dGVzdGUtdHJlaW5vcy1qd3Qtc2VjcmV0LTMyLWJ5dGVzLW9rIQ==
    # Sal e chave do MFA só desta suíte (a chave tem 32 bytes); não servem fora do teste.
    login:
      sal: sal-so-da-suite-de-testes
      # O limite por conta (10) continua o de produção e é testado no AuthIntegrationTest.
      limite-ip: 100000
    # E-mail de acesso ligado com o provedor "log"; o teste troca o envio por um que guarda as mensagens (EmailDeTeste).
    email:
      habilitado: true
      provedor: log
      remetente: "Consultoria <acesso@teste.local>"
      nome-app: Consultoria
    redefinicao:
      habilitado: true
      url-base: http://localhost:8088/redefinir-senha
      limite-ip: 100000
    mfa:
      chaves: "teste:Y2hhdmUtYWVzLTI1Ni1zby1kYS1zdWl0ZS10ZXN0ZSE="
      chave-ativa: teste
treinos:
  # Toda a suíte sai de 127.0.0.1: os limites por IP ficam altos para um teste não bloquear o outro.
  # O limite por conta (10) continua o de produção e é testado no AuthIntegrationTest.
  limites:
    cadastro-ip: 100000
    logo-ip: 100000
    convite-ip: 100000
    convite-equipe-consulta-ip: 100000
    refresh-ip: 100000
    inscricao-ip: 100000
    inscricao-consulta-ip: 100000
    cep-ip: 100000
    loja-ip: 100000
    loja-foto-ip: 100000
    marketplace-ip: 100000
    contrato-publico-ip: 100000
    contrato-cpf-ip: 100000
  # Fotos ligadas em toda a suíte (o bucket é um MinIO de teste, registrado por MinioDeTeste); o modo desligado tem a sua
  # classe (FotosDesligadasIntegrationTest), que sobrescreve esta chave.
  fotos:
    habilitado: true
  # Ciclo ligado na suíte (o CicloMenstrualIntegrationTest testa o módulo); o modo desligado tem a sua classe.
  ciclo:
    habilitado: true
  # Concluir treino ligado na suíte; o modo desligado tem a sua classe (RetornoDesligadoIntegrationTest).
  retorno:
    habilitado: true
  # Contrato digital ligado na suíte; o modo desligado tem a sua classe (ContratosDesligadosIntegrationTest).
  contratos:
    habilitado: true
    # A rotina de guarda do assinado (D16) fica sem agenda: os testes chamam GuardaDoContratoAssinado.rodar à mão.
    guarda-agendada: false
  # Vitrine ligada na suíte; o modo desligado tem a sua classe (VitrineDesligadaIntegrationTest).
  vitrine:
    habilitada: true
    loja-habilitada: true
    marketplace-habilitado: true
  # Escolha de kg/lb ligada na suíte; o modo desligado tem a sua classe (UnidadeDeCargaDesligadaIntegrationTest).
  unidade-carga:
    habilitado: true
  # Migração assistida ligada na suíte; o modo desligado tem a sua classe (MigracaoAssistidaDesligadaIntegrationTest).
  migracao-assistida:
    habilitado: true
  # Pagamentos ligados em toda a suíte; o modo desligado tem a sua classe (PagamentosDesligadosIntegrationTest).
  # A retenção das sessões da importação assistida fica desligada: o teste chama ImportacaoAssistidaRetencao.limpar à mão.
  importacao:
    assistida:
      retencao-agendada: false
  # A limpeza diária dos avisos de compromisso fica desligada: o teste chama AvisosDeCompromissoRetencao.limpar à mão.
  agenda:
    avisos:
      limpeza-agendada: false
  # Push ligado na suíte; o envio agendado fica desligado (o teste chama PushDoExpo.rodar à mão) e a URL do Expo é a do servidor
  # de mentira de cada teste. O modo desligado tem a sua classe (PushDesligadoIntegrationTest).
  push:
    habilitado: true
    envio-agendado: false
  # WhatsApp ligado na suíte, com valores fictícios óbvios (não servem fora do teste); o envio agendado fica desligado (o teste chama
  # WhatsAppDaFila.rodar à mão) e a URL da Meta é a do servidor de mentira de cada teste. O modo desligado tem a sua classe
  # (WhatsAppDesligadoIntegrationTest).
  whatsapp:
    habilitado: true
    chaves: "teste:Y2hhdmUtd2hhdHNhcHAtc28tZGEtc3VpdGUtdGVzdGU=,antiga:b3V0cmEtY2hhdmUtd2hhdHNhcHAtdGVzdGUtMzJiISE="
    chave-ativa: teste
    meta-app-secret: segredo-do-app-so-de-teste
    meta-verify-token: verify-token-so-de-teste
    envio-agendado: false
  pagamentos:
    habilitado: true
    # Chaves só desta suíte (32 bytes cada; a segunda é a "antiga" que ainda decifra); não servem fora do teste.
    chaves: "teste:Y2hhdmUtcGFnYW1lbnRvcy1zby1kYS1zdWl0ZS10cyE=,antiga:b3V0cmEtY2hhdmUtcGFnYW1lbnRvcy10ZXN0ZS0zMmI="
    chave-ativa: teste
    pagar-no-ios: false
    pagar-no-android: false
    # InfinitePay ligada em toda a suíte (PapeisBancoIntegrationTest sobe com test,docker); o modo desligado tem a sua classe.
    # Nenhuma chamada real: o cliente aponta para um servidor falso. O conciliador agendado fica desligado.
    infinitepay:
      habilitado: true
      url-publica: https://api.teste.local
      conciliacao-ativa: false
    # Kiwify DESLIGADA na suíte (ligada sem as variáveis a API não sobe, e várias classes esvaziam as chaves): as classes Kiwify*
    # a ligam com @DynamicPropertySource, apontando para a Kiwify de mentira. O conciliador agendado fica desligado.
    kiwify:
      habilitado: false
      conciliacao-ativa: false
    # O job dos lembretes de cobrança também: os testes chamam LembretesDeCobranca.rodar à mão.
    lembretes:
      agendados: false
    # A geração diária das mensalidades também: os testes chamam RotinaDeGeracaoDeCobrancas.rodar à mão.
    geracao:
      agendada: false
  # A suíte cria treinadores pelo cadastro público; o modo fechado (o de produção) tem a sua classe.
  cadastro:
    aberto: true

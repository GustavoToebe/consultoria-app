spring:
  datasource:
    hikari:
      # A suíte guarda vários contextos do Spring ao mesmo tempo (cada combinação de configuração é um), todos no mesmo Postgres
      # de teste (max_connections 100). Com o pool de produção (10) o mvn verify local estourava as conexões; 3 com nenhuma
      # ociosa por padrão sobra para o teste e deixa o Postgres respirar.
      maximum-pool-size: 3
      minimum-idle: 0
# Segredo só desta suíte. O valor decodifica para 37 bytes; não serve fora do teste.
plataforma:
  auth:
    jwt:
      secret: dGVzdGUtdHJlaW5vcy1qd3Qtc2VjcmV0LTMyLWJ5dGVzLW9rIQ==
    # Sal e chave do MFA só desta suíte (a chave tem 32 bytes); não servem fora do teste.
    login:
      sal: sal-so-da-suite-de-testes
      # O limite por conta (10) continua o de produção e é testado no AuthIntegrationTest.
      limite-ip: 100000
    # E-mail de acesso ligado com o provedor "log"; o teste troca o envio por um que guarda as mensagens (EmailDeTeste).
    email:
      habilitado: true
      provedor: log
      remetente: "Consultoria <acesso@teste.local>"
      nome-app: Consultoria
    redefinicao:
      habilitado: true
      url-base: http://localhost:8088/redefinir-senha
      limite-ip: 100000
    mfa:
      chaves: "teste:Y2hhdmUtYWVzLTI1Ni1zby1kYS1zdWl0ZS10ZXN0ZSE="
      chave-ativa: teste
treinos:
  # Toda a suíte sai de 127.0.0.1: os limites por IP ficam altos para um teste não bloquear o outro.
  # O limite por conta (10) continua o de produção e é testado no AuthIntegrationTest.
  limites:
    cadastro-ip: 100000
    logo-ip: 100000
    convite-ip: 100000
    convite-equipe-consulta-ip: 100000
    refresh-ip: 100000
    inscricao-ip: 100000
    inscricao-consulta-ip: 100000
  # Fotos ligadas em toda a suíte (o bucket é um MinIO de teste, registrado por MinioDeTeste); o modo desligado tem a sua
  # classe (FotosDesligadasIntegrationTest), que sobrescreve esta chave.
  fotos:
    habilitado: true
  # Pagamentos ligados em toda a suíte; o modo desligado tem a sua classe (PagamentosDesligadosIntegrationTest).
  pagamentos:
    habilitado: true
    # Chaves só desta suíte (32 bytes cada; a segunda é a "antiga" que ainda decifra); não servem fora do teste.
    chaves: "teste:Y2hhdmUtcGFnYW1lbnRvcy1zby1kYS1zdWl0ZS10cyE=,antiga:b3V0cmEtY2hhdmUtcGFnYW1lbnRvcy10ZXN0ZS0zMmI="
    chave-ativa: teste
    pagar-no-ios: false
    pagar-no-android: false
    # InfinitePay ligada em toda a suíte (PapeisBancoIntegrationTest sobe com test,docker); o modo desligado tem a sua classe.
    # Nenhuma chamada real: o cliente aponta para um servidor falso. O conciliador agendado fica desligado.
    infinitepay:
      habilitado: true
      url-publica: https://api.teste.local
      conciliacao-ativa: false
  # A suíte cria treinadores pelo cadastro público; o modo fechado (o de produção) tem a sua classe.
  cadastro:
    aberto: true

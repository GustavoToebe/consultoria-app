# Cache de contextos do Spring dos testes: o padrao e 32. Cada contexto guarda ate 3 conexoes (hikari.maximum-pool-size do
# application-test.yml) no Postgres unico da suite (max_connections 100, 3 reservadas), entao 32 contextos vivos podem
# ocupar ~96 vagas e os testes que abrem conexao propria (PapeisBancoIntegrationTest, ConsultoriaNovaComoPapelDaApiIntegrationTest)
# levam 53300. Com 12, o pior caso fixo sao 36. Custo: contexto de configuracao rara pode subir de novo.
spring.test.context.cache.maxSize=12

# No Docker o Caddy é o único proxy e fica na rede interna: só aqui a API confia nos cabeçalhos X-Forwarded-*
# (o Tomcat aceita apenas de endereços internos). Sem isso, o limite de login veria o IP do Caddy.
server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Porta que o navegador usou (8088). Sem ela, com X-Forwarded-Proto: http o Tomcat assume 80 e a web servida
      # pelo próprio Caddy vira "outra origem" para o CORS.
      port-header: X-Forwarded-Port

# Papéis do banco (docs/papeis-banco.md): o Flyway e o módulo de autenticação migram com o papel dono do schema
# (MIGRATION_DB_*); a API roda com DB_* (papel só de dados). Sem MIGRATION_DB_* vale o DB_*, como no ambiente local de
# um usuário só. PLATAFORMA_PAPEL_APP é o papel da API, obrigatório e sem valor padrão: com ele o módulo concede o schema
# plataforma e o callback afterMigrate__revogar_historico_do_app.sql fecha o flyway_schema_history. Se API e Flyway usam
# o mesmo usuário, informe esse usuário (o callback o ignora).
spring:
  flyway:
    url: ${MIGRATION_DB_URL:${DB_URL}}
    user: ${MIGRATION_DB_USER:${DB_USUARIO}}
    password: ${MIGRATION_DB_PASSWORD:${DB_SENHA}}
    placeholders:
      papelApp: ${PLATAFORMA_PAPEL_APP}
    # Espera por trava limitada a 60 s, só nas conexões do Flyway (nunca no datasource da API): em 26/10 uma migration
    # ficou horas atrás de uma sessão parada "idle in transaction" e a API não subia. Agora a subida falha com erro,
    # a migration volta inteira e a próxima subida tenta de novo. O Flyway do módulo de autenticação (abaixo) não lê
    # init-sqls: o mesmo limite vai como parâmetro `options` na URL dele.
    init-sqls:
      - SET lock_timeout = '60s'

plataforma:
  auth:
    migracao:
      # `options=-c lock_timeout=60s` (o pgjdbc decodifica %20 e %3D) é anexado com `?`: DB_URL e MIGRATION_DB_URL não podem
      # trazer parâmetros (sem `?` na URL; o compose de produção só passa host, porta e banco).
      url: ${MIGRATION_DB_URL:${DB_URL}}?options=-c%20lock_timeout%3D60s
      user: ${MIGRATION_DB_USER:${DB_USUARIO}}
      password: ${MIGRATION_DB_PASSWORD:${DB_SENHA}}
      papel-app: ${PLATAFORMA_PAPEL_APP}

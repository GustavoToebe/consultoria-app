spring:
  application:
    name: treinos-api
  threads:
    virtual:
      enabled: true
  # Segredos e banco sem valor padrão: faltando a variável, a API não sobe (ConfiguracaoProducaoTest).
  datasource:
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_SENHA}
    hikari:
      # Com threads virtuais (acima) não há limite de threads do Tomcat: o pool é o que limita a concorrência no banco.
      maximum-pool-size: 10
      data-source-properties:
        # O "Detalhe" do erro do Postgres traz os valores da linha (e-mail, peso): fica fora de exceção e de log.
        logServerErrorDetail: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false
    # Papel da API para o callback afterMigrate__revogar_historico_do_app.sql. Vazio = nada a fazer (um usuário só: testes e
    # dev). No perfil docker (produção) a variável é obrigatória e sem valor padrão (application-docker.yml).
    placeholders:
      papelApp: ${PLATAFORMA_PAPEL_APP:}
  servlet:
    multipart:
      # Até 1 MiB, igual ao limite do corpo da requisição: cabe a foto de atualização (FotoService.BYTES_MAXIMO). O logo da
      # consultoria continua limitado a 512 KiB no MarcaService.
      max-file-size: 1MB
      max-request-size: 1MB

treinos:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}
  app-url: ${APP_URL:http://localhost:8088}
  # Integração com a Central (docs/integracao-central.md). Desligada por padrão: Minha conta usa os dados locais de
  # demonstração. Ligada, a API só sobe com chaves e URL completas. Segredos só em variável de ambiente.
  integracao:
    ativa: ${TREINOS_INTEGRACAO_ATIVA:false}
    chaves-entrada: ${TREINOS_INTEGRACAO_CHAVES_ENTRADA:}
    chave-saida-id: ${TREINOS_INTEGRACAO_CHAVE_SAIDA_ID:}
    chave-saida-segredo: ${TREINOS_INTEGRACAO_CHAVE_SAIDA_SEGREDO:}
    central-url: ${TREINOS_INTEGRACAO_CENTRAL_URL:}
    produto: ${TREINOS_INTEGRACAO_PRODUTO:TREINOS}
    tolerancia-horas: ${TREINOS_INTEGRACAO_TOLERANCIA_HORAS:72}
    bloqueio-ativo: ${TREINOS_INTEGRACAO_BLOQUEIO_ATIVO:false}
  # Cadastro público de treinador (POST /auth/cadastro-treinador). Fechado por padrão: aberto, qualquer pessoa cria uma
  # consultoria, descobre se um e-mail já tem conta e ocupa o e-mail de quem ainda vai contratar pela Central (que vincula
  # pelo e-mail do administrador). Consultoria nova em produção entra pela Central. Fechado, a rota responde 404.
  cadastro:
    aberto: ${TREINOS_CADASTRO_ABERTO:false}
  # Aplica o plano da Central (limites e funcionalidades de direitos_locais) a quem cria algo novo. Desligada por padrão:
  # ligar antes de o produto ter as funcionalidades configuradas na Central tiraria Mobilidade e Equipe das consultorias.
  # Sem linha em direitos_locais (integração desligada, demo) nada é barrado, ligada ou não. docs/integracao-central.md.
  plano:
    aplicar: ${TREINOS_PLANO_APLICAR:false}
  # Verificação humana (Cloudflare Turnstile) no cadastro de treinador, no login e no "esqueci a senha". Desligada por padrão.
  # Ligada, a API só sobe com a chave pública e o segredo; o segredo só em variável de ambiente, sem valor padrão. A chave
  # pública chega ao app por GET /publico/configuracao. Só ligar depois de a CSP do site liberar challenges.cloudflare.com.
  turnstile:
    habilitado: ${TREINOS_TURNSTILE_HABILITADO:false}
    site-key: ${TREINOS_TURNSTILE_SITE_KEY:}
    segredo: ${TREINOS_TURNSTILE_SEGREDO:}
    # Site em que o token precisa ter sido resolvido (resposta do siteverify). Vazio = o host do APP_URL.
    hostname: ${TREINOS_TURNSTILE_HOSTNAME:}
  # Fotos da atualização do aluno (dado sensível, bucket privado S3/R2). Desligado por padrão: a pergunta FOTOS fica sem envio.
  # Ligado, a API só sobe com endpoint, bucket, chave e segredo; segredos só em variável de ambiente, sem valor padrão.
  fotos:
    habilitado: ${TREINOS_FOTOS_HABILITADO:false}
    endpoint: ${TREINOS_FOTOS_ENDPOINT:}
    bucket: ${TREINOS_FOTOS_BUCKET:}
    chave: ${TREINOS_FOTOS_CHAVE:}
    segredo: ${TREINOS_FOTOS_SEGREDO:}
    regiao: ${TREINOS_FOTOS_REGIAO:auto}

# Coleta de métricas (docs/biblioteca-comum.md): fechada sem um token de 32 a 128 caracteres [A-Za-z0-9_-].
monitoramento:
  token: ${MONITORAMENTO_TOKEN:}

plataforma:
  # Login, JWT, refresh, CSRF e MFA vêm do módulo de autenticação (schema "plataforma", migrations próprias). Quem migra
  # (Flyway do app e do módulo) é o papel dono do schema, MIGRATION_DB_* no perfil docker (application-docker.yml); fora dele
  # (testes, dev) é o mesmo usuário DB_* da API, que precisa poder criar o schema.
  auth:
    habilitado: true
    jwt:
      secret: ${TREINOS_JWT_SEGREDO}
      emissor: consultoria
      access-ttl: PT15M
    refresh:
      ttl: P30D
    # Web: cookie HttpOnly. Atrás do Caddy a API fica em /api, então o cookie vai em /api/auth (docker-compose.yml).
    # secure=false só no ambiente local por IP da rede (http); em produção sempre true.
    cookie:
      nome: TREINOS_REFRESH
      path: ${REFRESH_COOKIE_PATH:/auth}
      secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: Strict
    # Nome próprio para não colidir com outro app no mesmo domínio pai (Central: CENTRAL-XSRF-TOKEN).
    csrf:
      cookie: TREINOS-XSRF-TOKEN
      header: X-XSRF-TOKEN
      path: /
      secure: ${REFRESH_COOKIE_SECURE:true}
      somente-com-cookie-de-refresh: true
    login:
      limite-ip: ${TREINOS_AUTH_LIMITE_IP:60}
      limite-conta: ${TREINOS_AUTH_LIMITE_CONTA:10}
      janela-segundos: ${TREINOS_AUTH_JANELA_SEGUNDOS:600}
      sal: ${TREINOS_LOGIN_SAL}
    # E-mail de acesso (redefinição de senha e convite de equipe): desligado por padrão. Em produção TREINOS_EMAIL_HABILITADO=true,
    # TREINOS_EMAIL_PROVEDOR=resend, remetente do subdomínio verificado no Resend e a chave "Sending access" só desse domínio.
    # Sem a chave o app não sobe com o provedor resend; o provedor "log" só registra que houve envio (nunca o link).
    email:
      habilitado: ${TREINOS_EMAIL_HABILITADO:false}
      provedor: ${TREINOS_EMAIL_PROVEDOR:log}
      remetente: ${TREINOS_EMAIL_REMETENTE:}
      nome-app: ${TREINOS_EMAIL_NOME_APP:Consultoria}
      resend:
        api-key: ${TREINOS_EMAIL_RESEND_API_KEY:}
    # "Esqueci a senha": o link leva o token no fragmento (#token=...) para a tela /redefinir-senha do app.
    redefinicao:
      habilitado: ${TREINOS_EMAIL_HABILITADO:false}
      url-base: ${APP_URL:http://localhost:8088}/redefinir-senha
    # Chaves AES-256 do MFA (id:base64, separadas por vírgula). Sem chave, o login funciona e ativar o MFA responde 503.
    mfa:
      chaves: ${TREINOS_MFA_CHAVES:}
      chave-ativa: ${TREINOS_MFA_CHAVE_ATIVA:}
      contexto: consultoria
  web:
    # O log do 500 mostra por onde o erro passou no código do app (só as classes, nunca a mensagem).
    prefixo-codigo-proprio: br.com.treinos.

server:
  port: ${PORT:8080}
  forward-headers-strategy: none
  tomcat:
    max-swallow-size: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

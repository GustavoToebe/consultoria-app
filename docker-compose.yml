# Ambiente local da demonstração: Postgres + API + web (Caddy) + importação do conteúdo do Saraiva.
#   cp .env.example .env    (preencher as obrigatórias)
#   docker compose up -d --build
#   Web: http://localhost:8088  (na rede: http://IP-DO-PC:8088). A API fica em /api.
# Banco e API não publicam porta: só o Caddy é exposto.
name: treinos

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: treinos
      POSTGRES_USER: ${POSTGRES_USER:-treinos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      # No Postgres 18 o diretório de dados fica numa subpasta versionada de /var/lib/postgresql.
      - dados-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d treinos"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./api
      secrets: [gh_token]
    restart: unless-stopped
    mem_limit: 768m
    environment:
      # Sem demonstração por padrão (contas e dados fictícios com a mesma senha). Para ligar: SPRING_PROFILES_ACTIVE=docker,demo
      # e COMPOSE_PROFILES=demo no .env (o segundo sobe o serviço `importacao`).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DB_URL: jdbc:postgresql://db:5432/treinos
      DB_USUARIO: ${POSTGRES_USER:-treinos}
      DB_SENHA: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      # Local há um usuário só (dono e API): o papel da API é ele mesmo. Em produção são dois (docs/papeis-banco.md).
      PLATAFORMA_PAPEL_APP: ${POSTGRES_USER:-treinos}
      TREINOS_JWT_SEGREDO: ${TREINOS_JWT_SEGREDO:?defina TREINOS_JWT_SEGREDO no .env}
      TREINOS_LOGIN_SAL: ${TREINOS_LOGIN_SAL:?defina TREINOS_LOGIN_SAL no .env}
      # Vazias = o treinador não consegue ativar a verificação em duas etapas (503 MFA_INDISPONIVEL).
      TREINOS_MFA_CHAVES: ${TREINOS_MFA_CHAVES:-}
      TREINOS_MFA_CHAVE_ATIVA: ${TREINOS_MFA_CHAVE_ATIVA:-}
      # Vazio = coleta de métricas fechada (sem coletor externo configurado).
      MONITORAMENTO_TOKEN: ${MONITORAMENTO_TOKEN:-}
      # Só o perfil demo lê; ligado e vazio, a API não sobe.
      DEMO_SENHA: ${DEMO_SENHA:-}
      TREINOS_DEMO_HISTORICO: ${TREINOS_DEMO_HISTORICO:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      APP_URL: ${APP_URL:-http://localhost:8088}
      # Atrás do Caddy a API fica em /api: o cookie de refresh vai em /api/auth.
      REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/api/auth}
      # Só neste ambiente local: o celular acessa por http://IP-DO-PC (sem HTTPS) e o navegador recusaria cookie
      # Secure. Em produção (com HTTPS) fica true.
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      # Integração com a Central (docs/integracao-central.md). Tudo opcional; sem TREINOS_INTEGRACAO_ATIVA=true nada muda.
      TREINOS_INTEGRACAO_ATIVA: ${TREINOS_INTEGRACAO_ATIVA:-false}
      TREINOS_INTEGRACAO_CHAVES_ENTRADA: ${TREINOS_INTEGRACAO_CHAVES_ENTRADA:-}
      TREINOS_INTEGRACAO_CHAVE_SAIDA_ID: ${TREINOS_INTEGRACAO_CHAVE_SAIDA_ID:-}
      TREINOS_INTEGRACAO_CHAVE_SAIDA_SEGREDO: ${TREINOS_INTEGRACAO_CHAVE_SAIDA_SEGREDO:-}
      TREINOS_INTEGRACAO_CENTRAL_URL: ${TREINOS_INTEGRACAO_CENTRAL_URL:-}
      TREINOS_INTEGRACAO_PRODUTO: ${TREINOS_INTEGRACAO_PRODUTO:-TREINOS}
      TREINOS_INTEGRACAO_TOLERANCIA_HORAS: ${TREINOS_INTEGRACAO_TOLERANCIA_HORAS:-72}
      TREINOS_INTEGRACAO_BLOQUEIO_ATIVO: ${TREINOS_INTEGRACAO_BLOQUEIO_ATIVO:-false}
      TREINOS_PLANO_APLICAR: ${TREINOS_PLANO_APLICAR:-false}
      # Verificação humana (Turnstile): desligada por padrão. O segredo só vem do ambiente, nunca com valor padrão.
      TREINOS_TURNSTILE_HABILITADO: ${TREINOS_TURNSTILE_HABILITADO:-false}
      TREINOS_TURNSTILE_SITE_KEY: ${TREINOS_TURNSTILE_SITE_KEY:-}
      TREINOS_TURNSTILE_SEGREDO: ${TREINOS_TURNSTILE_SEGREDO:-}
      # Fotos da atualização: desligadas por padrão (a pergunta FOTOS segue sem envio). Para testar local, suba o MinIO
      # (docker compose --profile fotos up -d) e use os valores do .env.example. Em produção o bucket é o R2 da Cloudflare.
      TREINOS_FOTOS_HABILITADO: ${TREINOS_FOTOS_HABILITADO:-false}
      TREINOS_FOTOS_ENDPOINT: ${TREINOS_FOTOS_ENDPOINT:-}
      TREINOS_FOTOS_BUCKET: ${TREINOS_FOTOS_BUCKET:-}
      TREINOS_FOTOS_CHAVE: ${TREINOS_FOTOS_CHAVE:-}
      TREINOS_FOTOS_SEGREDO: ${TREINOS_FOTOS_SEGREDO:-}
      TREINOS_FOTOS_REGIAO: ${TREINOS_FOTOS_REGIAO:-auto}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 12

  # Bucket S3 local para as fotos da atualização (só no perfil "fotos"; sem ele nada sobe). Imagem do Chainguard porque o
  # minio/minio saiu do Docker Hub. Não publica porta: só a API fala com ele.
  #   TREINOS_FOTOS_HABILITADO=true  TREINOS_FOTOS_ENDPOINT=http://minio:9000  TREINOS_FOTOS_BUCKET=consultoria-fotos
  #   TREINOS_FOTOS_CHAVE=<MINIO_USUARIO>  TREINOS_FOTOS_SEGREDO=<MINIO_SENHA>
  minio:
    image: cgr.dev/chainguard/minio:latest
    profiles: [fotos]
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USUARIO:-}
      MINIO_ROOT_PASSWORD: ${MINIO_SENHA:-}
    volumes:
      - dados-fotos:/data

  # Cria o bucket uma vez (idempotente). O `mc` lê o acesso da variável MC_HOST_<alias>.
  minio-bucket:
    image: cgr.dev/chainguard/minio-client:latest
    profiles: [fotos]
    restart: on-failure
    environment:
      MC_HOST_local: http://${MINIO_USUARIO:-}:${MINIO_SENHA:-}@minio:9000
    command: ["mb", "--ignore-existing", "local/${TREINOS_FOTOS_BUCKET:-consultoria-fotos}"]
    depends_on:
      - minio

  web:
    build: ./app
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./deploy-local/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy

  # Conteúdo do Saraiva (vídeos, modelos de treino e mobilidade, suplementos, medicação e ergogênicos) entra com a
  # demonstração (COMPOSE_PROFILES=demo, ele usa a conta do treinador demo): roda scripts/importacao/importar.mjs uma vez, depois que a API está saudável. É idempotente (só cria o que
  # falta), então repete a cada "up" sem efeito colateral. Para as opções (--simular, --substituir, --trocar-videos),
  # rode o script à mão no PC.
  importacao:
    image: node:24-alpine
    profiles: [demo]
    restart: "no"
    working_dir: /importacao
    volumes:
      - ./scripts/importacao:/importacao:ro
    environment:
      # Dentro da rede do compose a API responde na raiz (o /api é só do Caddy).
      API_URL: http://api:8080
      # Serviço só do perfil demo; sem a senha o script avisa e sai.
      DEMO_SENHA: ${DEMO_SENHA:-}
    command: ["node", "importar.mjs"]
    depends_on:
      api:
        condition: service_healthy

# Token de leitura do GitHub Packages (read:packages) para baixar a biblioteca plataforma no build da API. Arquivo fora do git
# (deploy-local/segredos/ está no .gitignore): ver README, "Token do GitHub Packages".
secrets:
  gh_token:
    file: ./deploy-local/segredos/gh_token

volumes:
  dados-db:
  dados-fotos:

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo · Primeiro uso do treinador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Protótipo A01 (orientação guiada no primeiro uso do treinador), 30/10/2026. Dados fictícios. Nada aqui fala com a API.
   Mesmo esqueleto de docs/prototipos/alunos.html: variáveis dos tokens, três temas, painel "Ajustes", "como celular". */
:root { --fonte: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; --raio: 12px; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--fonte); background: var(--fundo); color: var(--texto); font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--texto); outline-offset: 2px; }
@media (prefers-reduced-motion: no-preference) {
  .anima { transition: background-color .12s, border-color .12s, transform .08s; } .anima:active:not(:disabled) { transform: scale(.97); }
  .barra-prog i { transition: width .45s ease-out; }
  .entra { animation: entra .2s ease-out; }
  .esq { animation: pulsa 1.2s ease-in-out infinite; }
}
@keyframes entra { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes pulsa { 50% { opacity: .55; } }

#app { display: flex; min-height: 100vh; }
body.simula-cel #app { max-width: 390px; margin: 16px auto; min-height: calc(100vh - 32px); border: 1px solid var(--borda); border-radius: 20px; overflow: hidden; }
@media (min-width: 900px) { body.com-ajustes #app { margin-right: 340px; } body.com-ajustes.simula-cel #app { margin-right: auto; transform: translateX(-170px); } }
.principal { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* menu lateral, barra de topo e barra inferior (iguais às do protótipo de alunos) */
.menu { width: 240px; flex-shrink: 0; background: var(--sup); border-right: 1px solid var(--borda); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.menu .logo { height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--borda); }
.menu .logo .q { width: 32px; height: 32px; border-radius: 8px; background: var(--marca); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.menu .logo b { display: block; font-size: 15px; } .menu .logo small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); }
.menu nav { padding: 8px; display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
.menu .grupo { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); padding: 12px 10px 4px; }
.item-menu { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: var(--raio); color: var(--suave); border: 0; background: none; width: 100%; text-align: left; }
.item-menu:hover { background: var(--sup3); color: var(--texto); }
.item-menu.ativo { background: var(--marca); color: #fff; font-weight: 600; }
.topo { height: 60px; display: flex; align-items: center; gap: 16px; padding: 0 24px; background: var(--sup); border-bottom: 1px solid var(--borda); position: relative; }
.busca { flex: 1; max-width: 520px; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 1px solid var(--bordaCampo); border-radius: var(--raio); background: var(--campo); color: var(--suave); }
.busca kbd { margin-left: auto; font-size: 11px; border: 1px solid var(--borda); border-radius: 4px; padding: 1px 6px; }
.topo .dir { margin-left: auto; display: flex; align-items: center; gap: 16px; position: relative; }
.usuario { display: flex; align-items: center; gap: 10px; border: 1px solid var(--borda); border-radius: var(--raio); padding: 6px 12px; background: var(--sup); text-align: left; }
.usuario:hover { background: var(--sup3); }
.usuario b { display: block; font-size: 13px; } .usuario small { color: var(--suave); font-size: 12px; }
.inferior { display: none; }
body.cel .menu, body.cel .topo { display: none; }
body.cel .inferior { display: flex; position: sticky; bottom: 0; background: var(--sup); border-top: 1px solid var(--borda); z-index: 10; }
.inferior button { flex: 1; border: 0; background: none; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--suave); }
.inferior button.ativo { color: var(--marcaTexto); font-weight: 700; }

.conteudo { width: 100%; max-width: var(--largura, 1240px); margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 24px; }
body.cel .conteudo { padding: 16px 12px; gap: 16px; }
.trilha { display: flex; align-items: center; gap: 6px; color: var(--suave); font-size: 13px; flex-wrap: wrap; }
.trilha button { background: none; border: 0; padding: 0; color: var(--suave); text-decoration: underline; min-height: 24px; }
.trilha b { color: var(--texto); }
.cab-tela { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.cab-tela .tx { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 6px; }
.cab-tela .acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
h1 { font-size: 24px; line-height: 30px; margin: 0; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.suave { color: var(--suave); }
.pequeno { font-size: 12px; color: var(--suave); }
.link { background: none; border: 0; padding: 0 2px; min-height: 40px; color: var(--texto); text-decoration: underline; font-weight: 600; }

/* botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: var(--raio); border: 1px solid var(--borda); background: var(--sup); font-weight: 600; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--sup3); }
.btn.primario { background: var(--marca); border-color: var(--marca); color: #fff; }
.btn.primario:hover:not(:disabled) { filter: brightness(.92); background: var(--marca); }
.btn.fantasma { border-color: transparent; background: transparent; }
.btn.fantasma:hover:not(:disabled) { background: var(--sup3); }
.btn.perigo { color: var(--perigo); }
.btn:disabled { opacity: .5; cursor: default; }
.ib { width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: var(--raio); border: 1px solid var(--borda); background: var(--sup); color: var(--texto); flex-shrink: 0; }
.ib:hover:not(:disabled) { background: var(--sup3); }
body.cel .btn, body.cel .link { min-height: 44px; } body.cel .ib { width: 44px; height: 44px; }

/* selos */
.selo { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid var(--c); color: var(--c); background: color-mix(in srgb, var(--c) 9%, var(--sup)); }
.selo.sucesso { --c: var(--sucesso); } .selo.atencao { --c: var(--atencao); } .selo.perigo { --c: var(--perigo); } .selo.neutro { --c: var(--suave); }
.etiqueta { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border: 1px solid var(--borda); border-radius: 6px; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--suave); background: var(--sup); }

/* blocos */
.bloco { background: var(--sup); border: var(--bwBloco) solid var(--borda); border-radius: var(--raio); overflow: hidden; }
.faixa { background: var(--sup3); border-bottom: 3px solid var(--bordaCampo); padding: 14px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.faixa.sem-linha { border-bottom: 0; }
.faixa .tit { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 2px; }
.faixa .tit b { font-size: 17px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.faixa .tit small { color: var(--suave); font-size: 13px; }
.faixa .acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; align-items: center; }
.corpo { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
body.cel .corpo { padding: 16px; } body.cel .faixa { padding: 12px 16px; }
.rotulo { font-size: 13px; font-weight: 600; margin-bottom: 6px; display: block; }
.secao-titulo { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); }
.linha { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.campo { height: 42px; width: 100%; border: 1px solid var(--bordaCampo); background: var(--campo); border-radius: var(--raio); padding: 0 12px; color: var(--texto); }
.campo.erro { border: 2px solid var(--perigo); }
.msg-erro { color: var(--perigo); font-size: 12px; margin-top: 4px; display: block; }
.ajuda { color: var(--suave); font-size: 12px; margin-top: 4px; display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 0 14px; border-radius: var(--raio); border: 1px solid var(--borda); background: var(--sup); font-weight: 600; font-size: 13px; }
.chip:hover { background: var(--sup3); } .chip.sel { background: var(--texto); color: var(--fundo); border-color: var(--texto); }
body.cel .chip { min-height: 44px; }
.divisor { height: 1px; background: var(--divisor); border: 0; margin: 0; }
.grade-form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grade-form .inteiro { grid-column: 1 / -1; }
body.cel .grade-form { grid-template-columns: 1fr; }
.rodape-form { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; position: sticky; bottom: 0; padding: 12px 0; background: var(--fundo); border-top: 1px solid var(--divisor); }
body.cel .rodape-form { bottom: 57px; }
.lista { display: flex; flex-direction: column; gap: 10px; }
.linha-reg { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 1px solid var(--borda); border-radius: var(--raio); background: var(--sup2); min-height: 60px; width: 100%; text-align: left; }
button.linha-reg:hover { background: var(--sup3); border-color: var(--bordaCampo); }
.linha-reg .tx { flex: 1; min-width: 0; } .linha-reg .tx b { display: block; font-size: 15px; } .linha-reg .tx small { color: var(--suave); font-size: 12px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--sup3); border: 1px solid var(--borda); flex-shrink: 0; }
.avatar.grande { width: 56px; height: 56px; font-size: 18px; }
.abas { display: flex; gap: 4px; border-bottom: 1px solid var(--divisor); overflow-x: auto; }
.abas button { border: 0; background: none; min-height: 44px; padding: 0 14px; font-weight: 600; color: var(--suave); border-bottom: 3px solid transparent; white-space: nowrap; }
.abas button.ativa { color: var(--texto); border-bottom-color: var(--marca); }

/* Próximo passo (faixa do Início e da ficha) */
.proximo { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 16px; border-radius: var(--raio); border: 1px solid var(--borda); border-left: 4px solid var(--c); background: var(--sup); }
.proximo.atencao { --c: var(--atencao); } .proximo.neutro { --c: var(--borda); } .proximo.perigo { --c: var(--perigo); }
.proximo .tx { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 2px; } .proximo .tx b { display: block; color: var(--texto); font-size: 16px; }

/* contadores do Início */
/* blocos do painel (iguais aos de painel.html) */
h2.tit-bloco { font-size: 17px; line-height: 22px; margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.faixa.faixa-painel { padding: 4px 0 4px 14px; min-height: 52px; flex-wrap: nowrap; gap: 4px; }
.faixa-painel .tit { min-width: 0; } .faixa-painel h2.tit-bloco { font-size: 15px; }
.faixa-painel .icones { display: flex; flex-shrink: 0; } .faixa-painel .ib { border-color: transparent; background: transparent; }
.grade-painel { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.grade-painel .corpo { padding: 12px; }
.minis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.mini { --c: var(--neutro); display: flex; flex-direction: column; gap: 4px; min-height: 76px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 9.4%, var(--sup)); color: var(--c); text-decoration: none; }
.mini.atencao { --c: var(--atencao); } .mini.perigo { --c: var(--perigo); } .mini.sucesso { --c: var(--sucesso); }
.mini .rot { font-size: 12px; line-height: 15px; font-weight: 700; min-height: 30px; } .mini .val { font-size: 24px; line-height: 28px; font-weight: 700; }
.mini.largo { grid-column: 1 / -1; flex-direction: row; align-items: center; justify-content: space-between; min-height: 52px; } .mini.largo .rot { min-height: 0; }
.mini:focus-visible { outline: 3px solid var(--texto); outline-offset: 2px; }
.cab-tela h1 .ic-h1 { color: var(--suave); }
.contadores { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.contador { display: flex; align-items: center; gap: 8px; border: 1px solid var(--borda); border-radius: var(--raio); padding: 14px 16px; background: var(--sup); text-align: left; min-height: 56px; }
.contador .tx { flex: 1; } .contador b { display: block; font-size: 22px; color: var(--suave); }
.dois { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
body.cel .dois { grid-template-columns: 1fr; }

/* caixa de aviso (ui/Estados Alerta): fundo claro, borda e texto na cor do tom */
.alerta { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; padding: 12px 14px; border-radius: var(--raio); border: 1px solid var(--c); color: var(--c); background: color-mix(in srgb, var(--c) 8%, var(--sup)); }
.alerta.perigo { --c: var(--perigo); } .alerta.sucesso { --c: var(--sucesso); } .alerta.atencao { --c: var(--atencao); }
.alerta .tx { flex: 1; min-width: 200px; } .alerta .tx b { display: block; }
.alerta .btn { color: var(--texto); }
.dica { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-radius: var(--raio); border: 1px dashed var(--bordaCampo); background: var(--sup2); }
.dica .tx { flex: 1; min-width: 220px; }

/* estados vazios: uma frase e uma ação */
.vazio { text-align: center; padding: 36px 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--suave); }
.vazio b { font-size: 16px; color: var(--texto); } .vazio p { margin: 0; max-width: 480px; }
.vazio .btn { margin-top: 6px; }

/* esqueleto */
.esq { background: var(--sup3); border-radius: var(--raio); }

/* primeiros passos */
.prog { display: inline-flex; align-items: center; gap: 10px; }
.prog b { font-size: 14px; }
.barra-prog { width: 120px; height: 8px; border-radius: 999px; background: var(--campo); border: 1px solid var(--bordaCampo); overflow: hidden; display: inline-block; }
.barra-prog i { display: block; height: 100%; background: var(--texto); }
body.cel .barra-prog { width: 72px; }
body.cel .faixa .acoes { margin-left: 0; width: 100%; }
body.cel .faixa .acoes .prog { margin-right: auto; }
.passos { display: flex; flex-direction: column; gap: 8px; list-style: none; margin: 0; padding: 0; }
.passo { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center; padding: 10px 14px; border: 1px solid var(--borda); border-radius: var(--raio); background: var(--sup2); }
.passo.aberto { border: var(--bwBloco) solid var(--texto); background: var(--sup); align-items: start; padding: 14px; }
.passo .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--bordaCampo); font-weight: 700; font-size: 13px; background: var(--campo); color: var(--texto); }
.passo.feito .n { border-color: var(--sucesso); color: var(--sucesso); background: color-mix(in srgb, var(--sucesso) 10%, var(--sup)); }
.passo .tx { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.passo .tx .tt { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.passo .tx .tt b { font-size: 15px; }
.passo.feito .tx .tt b { color: var(--suave); font-weight: 600; }
.passo .tx p { margin: 0; color: var(--suave); }
.passo .acoes-p { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
.passo.aberto .acoes-p { grid-column: 2 / -1; justify-content: flex-start; }
.motivo { font-size: 12px; color: var(--suave); }
body.cel .passo { grid-template-columns: 28px 1fr auto; gap: 10px; padding: 10px 12px; }
body.cel .passo.aberto .acoes-p, body.cel .passo .acoes-p:has(.motivo) { grid-column: 2 / -1; justify-content: flex-start; }

/* interruptor (seleção invertida) */
.interruptor { display: inline-flex; align-items: center; gap: 10px; border: 0; background: none; min-height: 44px; padding: 0; text-align: left; font-weight: 600; }
.interruptor .trilho { width: 44px; height: 26px; border-radius: 999px; border: 2px solid var(--bordaCampo); background: var(--campo); position: relative; flex-shrink: 0; }
.interruptor .trilho::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--bordaCampo); }
.interruptor[aria-checked="true"] .trilho { background: var(--texto); border-color: var(--texto); }
.interruptor[aria-checked="true"] .trilho::after { left: 20px; background: var(--fundo); }
@media (prefers-reduced-motion: no-preference) { .interruptor .trilho::after { transition: left .15s; } }
.copia { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.copia code { flex: 1; min-width: 200px; padding: 10px 12px; border: 1px solid var(--bordaCampo); border-radius: var(--raio); background: var(--campo); font-size: 13px; overflow-wrap: anywhere; }
.logo-prev { width: 72px; height: 72px; border-radius: var(--raio); border: 2px dashed var(--bordaCampo); display: grid; place-items: center; color: var(--suave); background: var(--campo); flex-shrink: 0; }
.logo-prev.com { border-style: solid; border-color: var(--marca); background: var(--marca); color: #fff; font-weight: 700; font-size: 20px; }
.cores { display: flex; gap: 10px; flex-wrap: wrap; }
.cores button { width: 44px; height: 44px; border-radius: var(--raio); border: 2px solid var(--borda); padding: 3px; background: var(--sup); }
.cores button span { display: block; width: 100%; height: 100%; border-radius: 8px; }
.cores button.sel { border-color: var(--texto); box-shadow: inset 0 0 0 2px var(--sup); }
.menu-usuario { position: absolute; right: 0; top: 52px; z-index: 30; min-width: 220px; background: var(--sup); border: var(--bwBloco) solid var(--borda); border-radius: var(--raio); padding: 6px; display: flex; flex-direction: column; }
.menu-usuario button { text-align: left; border: 0; background: none; padding: 10px 12px; border-radius: 8px; font-weight: 600; min-height: 40px; }
.menu-usuario button:hover { background: var(--sup3); }

/* painel de confirmação (PainelConfirmacao) */
.modal-fundo { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: grid; place-items: center; padding: 16px; }
.painel { width: 440px; max-width: 100%; background: var(--sup); border: var(--bwBloco) solid var(--borda); border-radius: var(--raio); overflow: hidden; }
.painel .corpo p { margin: 0; color: var(--suave); }
.painel .rodape { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; padding: 12px 20px 20px; }

/* passeio pelo menu (ui/Passeio): véu em quatro pedaços em volta do item, anel e balão */
.vela { position: fixed; background: rgba(0,0,0,.6); z-index: 58; }
.anel { position: fixed; z-index: 58; border: 3px solid #FFFFFF; border-radius: 12px; pointer-events: none; }
.balao { position: fixed; z-index: 59; width: 360px; max-width: calc(100vw - 32px); background: var(--sup); color: var(--texto); border: var(--bwBloco) solid var(--borda); border-radius: var(--raio); padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.balao .tit { font-size: 17px; font-weight: 700; margin: 0; }
.balao p { margin: 0; }
.balao .botoes { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.balao .botoes .dir { margin-left: auto; display: flex; gap: 8px; }

/* painel de ajustes do protótipo */
.abrir-ajustes { position: fixed; right: 16px; bottom: 16px; z-index: 60; background: #111114; color: #fff; border: 0; border-radius: 999px; height: 48px; padding: 0 18px; font-weight: 700; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
body.cel .abrir-ajustes { bottom: auto; top: 10px; right: 10px; height: 36px; padding: 0 12px; font-size: 12px; }
.ajustes { position: fixed; top: 0; right: 0; bottom: 0; width: 340px; max-width: 100vw; z-index: 70; background: #fff; color: #111114; border-left: 1px solid #B9B9C0; display: flex; flex-direction: column; font-size: 13px; }
.ajustes header { padding: 14px 16px; border-bottom: 1px solid #D4D4D8; display: flex; align-items: center; gap: 8px; background: #F4F4F5; }
.ajustes header b { flex: 1; font-size: 15px; }
.ajustes .lista-aj { overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.ajustes .op b { display: block; margin-bottom: 6px; font-size: 12px; } .ajustes .op small { display: block; color: #52525B; margin-top: 4px; }

.ajustes .opcoes button { border: 1px solid #B9B9C0; background: #fff; color: #111114; border-radius: 8px; padding: 6px 10px; font-weight: 600; font-size: 12px; }

.ajustes textarea { width: 100%; height: 110px; font-family: ui-monospace, monospace; font-size: 11px; }

.ajustes .sinais .ok { color: #176E3C; font-weight: 700; } .ajustes .sinais .dec { color: #875710; font-weight: 700; }
body.editando [data-t] { outline: 1px dashed #2563eb; outline-offset: 1px; cursor: text; border-radius: 3px; }
.editor-texto { position: fixed; z-index: 90; background: #fff; color: #111114; border: 1px solid #2563eb; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; width: 320px; max-width: calc(100vw - 16px); box-shadow: 0 6px 24px rgba(0,0,0,.2); }
.editor-texto input { height: 36px; border: 1px solid #8A8A93; border-radius: 6px; padding: 0 10px; }
.editor-texto .lb { display: flex; gap: 6px; } .editor-texto button { border: 1px solid #B9B9C0; background: #fff; border-radius: 6px; padding: 6px 10px; font-weight: 700; } .editor-texto button.forte { background: #111114; color: #fff; }
.aviso-flutuante { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 80; background: #111114; color: #fff; border-radius: 10px; padding: 10px 14px; font-size: 13px; max-width: calc(100vw - 32px); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.aviso-flutuante button { background: #fff; color: #111114; border: 0; border-radius: 8px; min-height: 36px; padding: 0 12px; font-weight: 700; }

<body>
<div id="app"></div>
<div id="camada-modal"></div>
<div id="camada-passeio"></div>
<div id="camada-ajustes"></div>
<div id="camada-aviso"></div>
<script>
'use strict';
/* ====================== cores (as de app/src/tema/tokens.ts, com o fundo quase branco) ====================== */
const TEMAS = {
  claro: { fundo:'#F7F7F8', sup:'#FFFFFF', sup2:'#F4F4F5', sup3:'#E7E7EA', divisor:'#D4D4D8', borda:'#B9B9C0', campo:'#FFFFFF', bordaCampo:'#8A8A93', texto:'#111114', suave:'#52525B', sucesso:'#176E3C', atencao:'#875710', perigo:'#B71C1C', neutro:'#616169' },
  areia: { fundo:'#FAF9F6', sup:'#FFFFFF', sup2:'#F7F5F0', sup3:'#E7E3DB', divisor:'#DDD8CF', borda:'#B9B3A9', campo:'#FFFFFF', bordaCampo:'#77736B', texto:'#111114', suave:'#52525B', sucesso:'#176E3C', atencao:'#875710', perigo:'#B71C1C', neutro:'#616169' },
  escuro: { fundo:'#0A0A0C', sup:'#18181B', sup2:'#222226', sup3:'#2C2C31', divisor:'#36363C', borda:'#4C4C55', campo:'#0F0F12', bordaCampo:'#707078', texto:'#F4F4F5', suave:'#A1A1AA', sucesso:'#2BB36A', atencao:'#D9962C', perigo:'#F0666B', neutro:'#9A9AA3' },
};
/* Cores da marca que seguram texto branco a 4,5:1 (como avaliarMarca de dominio/paletas.ts). */
const CORES_MARCA = [['#B71C1C', 'Vermelho'], ['#1D4ED8', 'Azul'], ['#047857', 'Verde'], ['#6D28D9', 'Roxo']];
/* Respostas do Gustavo (30/10) às perguntas da primeira versão: fixas, não são mais ajustes. A chave do armazenamento mudou
   para os ajustes da versão anterior (faixa, porcentagem, "some"...) não voltarem do navegador. */
const DECIDIDO = { onde:'inicio', proximo:'substitui', progresso:'fracao', dispensavel:true, aoConcluir:'recolhe', passeio:'antes', manuais:'conferir', painelVazio:'enxuto' };
const PADRAO = { tema:'claro', bordasReforcadas:false, perfil:'admin', estado:'normal', celular:false, editarTextos:false };
const CHAVE = 'prototipo-primeiro-uso-v2';
const consultoriaNova = () => ({ logo:false, cor:'#B71C1C', nome:'Consultoria Exemplo', metodologia:false, modelo:false, alunos:[], link:false, linkNaoAgora:false, passeioVisto:false, dispensado:false, concluidoFechado:false });
const membroNovo = () => ({ ...consultoriaNova(), logo:true, link:true, passeioVisto:false,
  alunos:[{ id:'a1', nome:'Ana Souza', acesso:'ativo' }, { id:'a2', nome:'Bruno Costa', acesso:'ativo' }, { id:'a3', nome:'Carla Mendes', acesso:'nenhum' }] });
let ajustes = { ...PADRAO }, textos = {}, dados = consultoriaNova();
try { const s = JSON.parse(localStorage.getItem(CHAVE) || 'null'); if (s) { ajustes = { ...PADRAO, ...(s.ajustes || {}) }; textos = s.textos || {}; dados = { ...consultoriaNova(), ...(s.dados || {}) }; } } catch (e) {}
Object.assign(ajustes, DECIDIDO);
const guardar = () => { try { localStorage.setItem(CHAVE, JSON.stringify({ ajustes, textos, dados })); } catch (e) {} };

/* ====================== ícones (desenho do lucide, o mesmo do app) ====================== */
const P = {
  casa:'<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .71-1.53l7-6a2 2 0 0 1 2.58 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  alunos:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  sino:'<path d="M10.27 21a2 2 0 0 0 3.46 0"/><path d="M3.26 15.33A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.67C19.41 13.96 18 12.5 18 8A6 6 0 0 0 6 8c0 4.5-1.41 5.96-2.74 7.33"/>',
  agenda:'<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
  caixa:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
  livro:'<path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>',
  camadas:'<path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',
  upload:'<path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>',
  equipe:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/>',
  ajuda:'<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>',
  busca:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  mais:'<path d="M5 12h14"/><path d="M12 5v14"/>',
  seta:'<path d="m9 18 6-6-6-6"/>', cima:'<path d="m18 15-6-6-6 6"/>', baixo:'<path d="m6 9 6 6 6-6"/>',
  ok:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>', alerta:'<circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
  circulo:'<circle cx="12" cy="12" r="9"/>', menos:'<circle cx="12" cy="12" r="10"/><path d="M8 12h8"/>',
  cadeado:'<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  wifi:'<path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M2 2l20 20"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.54"/>',
  check:'<path d="M20 6 9 17l-5-5"/>', fechar:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  pasta:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  perfil:'<circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>',
  copiar:'<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  paleta:'<circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.65-.75 1.65-1.69 0-.44-.18-.84-.44-1.13-.29-.29-.44-.65-.44-1.13a1.64 1.64 0 0 1 1.67-1.67h2c3.05 0 5.55-2.5 5.55-5.55C21.97 6.01 17.46 2 12 2z"/>',
  abrir:'<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  atualizar:'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  funil:'<path d="M10 20a1 1 0 0 0 .55.9l2 1A1 1 0 0 0 14 21v-7a2 2 0 0 1 .52-1.34L21.74 4.67A1 1 0 0 0 21 3H3a1 1 0 0 0-.74 1.67l7.22 7.99A2 2 0 0 1 10 14z"/>',
  lapis:'<path d="M21.17 6.81a1 1 0 0 0-3.98-3.98L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"/>',
  grafico:'<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
  mapa:'<path d="M14.1 4.1 9.9 2 3 5v17l6.9-3 4.2 2 6.9-3V1z"/><path d="M9.9 2v17"/><path d="M14.1 4.1v17"/>',
};
const ic = (n, t = 16) => `<svg width="${t}" height="${t}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n] || ''}</svg>`;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const PADROES = {};
const T = (id, padrao) => { PADROES[id] = padrao; return `<span data-t="${id}">${esc(textos[id] ?? padrao)}</span>`; };
const selo = (tipo, texto, icone) => `<span class="selo ${tipo}">${icone ? ic(icone, 12) : ''}${esc(texto)}</span>`;
const iniciais = (n) => n.split(' ').filter(Boolean).slice(0, 2).map((p) => p[0]).join('').toUpperCase();
const restrito = () => ajustes.perfil === 'restrito';

/* ====================== estado da tela ====================== */
let estado = { tela:'inicio', aba:'treino', chip:'semanas', id:null, form:{ nome:'', email:'' }, tentou:false, recolhido:false, listaAberta:false,
  verConcluidos:false, confirmar:false, passeio:null, menuUsuario:false, conviteDe:null, linkForm:null };
let ultimoProgresso = null, ultimoProximo = null;

/* ====================== primeiros passos: itens, progresso e o próximo ======================
   Cada item diz o que o app usaria para saber que está feito (painel "Ajustes" › "O que cada item usa"). */
function itens() {
  const temAluno = dados.alunos.length > 0;
  const lista = [
    { id:'marca', titulo:'Marca e logo', texto:'Envie a logo e escolha a cor. É o que os seus alunos veem quando entram no app.', acao:'Abrir Marca', tela:'marca',
      feito: dados.logo, oculto: restrito() },
    { id:'metodologia', manual:true, titulo:'Conferir a metodologia', texto:'A consultoria já vem com uma metodologia padrão (tipos de série, técnicas e combinações). Confira se ela é a sua.', acao:'Abrir Metodologias', tela:'planejamento',
      feito: dados.metodologia, oculto: restrito() },
    { id:'modelo', manual:true, titulo:'Conferir os modelos de treino', texto:'Já existem 3 semanas de treino e 2 dietas de exemplo no Planejamento. Ajuste uma delas ou crie a sua.', acao:'Abrir Planejamento', tela:'planejamento',
      feito: dados.modelo, oculto: restrito() },
    { id:'aluno', titulo:'Cadastrar o primeiro aluno', texto:'Só o nome é obrigatório. O treino e a dieta são montados na ficha dele, numa pasta por período.', acao:'Cadastrar aluno', tela:'novo',
      feito: temAluno },
    { id:'convite', titulo:'Dar acesso ao app ao aluno', texto:'Gere o convite (o aluno cria a própria senha) ou defina você o e-mail e uma senha provisória.', acao:'Abrir a ficha', tela:'ficha',
      feito: dados.alunos.some((a) => a.acesso !== 'nenhum'), bloqueado: temAluno ? null : 'Cadastre um aluno primeiro.' },
    { id:'link', opcional:true, titulo:'Ligar o link de inscrição', texto:'Quem se inscreve pelo link aparece em Interessados, para você atender e aceitar como aluno. Se não for usar agora, dá para deixar para depois.', acao:'Abrir Interessados', tela:'interessados',
      // "Deixado para depois" fica no aparelho, então continua conhecido; se a consulta da configuração do link falhou,
      // o item vira "Sem informação" mesmo que o link esteja ligado: nunca "Feito" sem ter conferido.
      pulado: dados.linkNaoAgora && !dados.link, desconhecido: ajustes.estado === 'parcial' && !dados.linkNaoAgora, feito: dados.link && ajustes.estado !== 'parcial' },
  ];
  return lista.filter((i) => !i.oculto);
}
/* Feito ou deixado para depois conta no "3 de 6"; "Sem informação" não conta e impede o "Concluídos". */
const resolvido = (i) => (i.feito && !i.desconhecido) || i.pulado;
function guia() {
  const lista = itens(), feitos = lista.filter(resolvido).length, total = lista.length, concluido = feitos === total;
  const proximo = lista.find((i) => !resolvido(i) && !i.bloqueado && !i.desconhecido) || lista.find((i) => !resolvido(i) && !i.bloqueado) || null;
  const ativo = !dados.dispensado && !(concluido && dados.concluidoFechado);
  return { lista, feitos, total, concluido, proximo, ativo };
}
const textoProgresso = (g) => `${g.feitos} de ${g.total}`;
function progHtml(g) {
  const p = Math.round((g.feitos / g.total) * 100), de = ultimoProgresso === null ? p : ultimoProgresso;
  return `<span class="prog" role="img" aria-label="Primeiros passos: ${g.feitos} de ${g.total} feitos ou deixados para depois"><b class="num">${textoProgresso(g)}</b><span class="barra-prog"><i data-p="${p}" style="width:${de}%"></i></span></span>`;
}

function linhaPasso(i, n, g, primarioNoItem) {
  const aberto = i === g.proximo, feito = resolvido(i);
  const st = i.pulado ? selo('neutro', 'Deixado para depois', 'menos') : i.desconhecido ? selo('neutro', 'Sem informação', 'alerta') : i.feito ? selo('sucesso', 'Feito', 'check')
    : i.bloqueado ? selo('neutro', 'Depois do aluno', 'cadeado') : selo('neutro', 'A fazer', 'circulo');
  let acoes = '';
  if (i.pulado) acoes = `<button class="btn fantasma anima" data-acao="desfazer-nao-agora" aria-label="Desfazer: ${esc(i.titulo)}">Desfazer</button>`;
  else if (i.bloqueado && !feito) acoes = `<button class="btn" disabled aria-describedby="motivo-${i.id}">${esc(i.acao)}</button><span class="motivo" id="motivo-${i.id}">${esc(i.bloqueado)}</span>`;
  else if (aberto) acoes = `<button class="btn ${primarioNoItem ? 'primario' : ''} anima" data-acao="item" data-id="${i.id}">${esc(i.acao)}</button>`
    + (i.manual ? `<button class="btn anima" data-acao="conferido" data-id="${i.id}">${ic('check')} Já conferi</button>` : '')
    + (i.opcional ? `<button class="btn fantasma anima" data-acao="nao-agora">Agora não</button>` : '');
  else if (!feito) acoes = `<button class="btn anima" data-acao="item" data-id="${i.id}" aria-label="${esc(i.acao)}: ${esc(i.titulo)}">Abrir</button>`;
  const texto = i.desconhecido && !feito ? '<p>Não foi possível conferir agora. Abra a tela para ver.</p>' : aberto ? `<p>${esc(i.texto)}</p>`
    : i.pulado ? '<p>Conta como resolvido. Quando quiser, ligue em Interessados.</p>' : '';
  const anima = aberto && ultimoProximo !== i.id ? 'entra' : '';
  return `<li class="passo ${aberto ? 'aberto' : ''} ${i.feito ? 'feito' : ''} ${anima}">
    <span class="n num" aria-hidden="true">${i.feito ? ic('check', 14) : n}</span>
    <div class="tx"><div class="tt"><b>${esc(i.titulo)}</b>${i.opcional ? '<span class="etiqueta">Opcional</span>' : ''}${st}</div>${texto}</div>
    ${acoes ? `<div class="acoes-p">${acoes}</div>` : ''}</li>`;
}
const listaPassos = (g, primarioNoItem) => `<ol class="passos" aria-label="Primeiros passos">${g.lista.map((i, k) => linhaPasso(i, k + 1, g, primarioNoItem)).join('')}</ol>`;

/* Bloco "Primeiros passos": o primeiro bloco do painel do Início (painel.html), no topo, enquanto não for concluído ou
   dispensado. Enquanto aberto, toma o lugar do "Próximo passo": o único primário é o do item aberto. */
function guiaNoInicio() {
  const g = guia();
  if (!g.ativo) return '';
  if (g.concluido) return blocoConcluido(g);
  return `<section class="bloco" aria-labelledby="tit-guia"><div class="faixa ${estado.recolhido ? 'sem-linha' : ''}" data-menu="guia"><div class="tit"><h2 class="tit-bloco" id="tit-guia">${T('guia.titulo', 'Primeiros passos')}</h2>
      <small>${T('guia.desc', 'O que falta para começar a atender pelo app. Cada item abre a tela certa.')}</small></div>
    <div class="acoes">${progHtml(g)}<button class="btn fantasma anima" data-acao="dispensar">Dispensar</button>
      <button class="ib anima" data-acao="recolher" aria-expanded="${!estado.recolhido}" aria-label="${estado.recolhido ? 'Mostrar' : 'Recolher'} os primeiros passos">${ic(estado.recolhido ? 'baixo' : 'cima')}</button></div></div>
    ${estado.recolhido ? '' : `<div class="corpo">${listaPassos(g, true)}</div>`}</section>`;
}
/* Concluído: vira uma linha "Concluídos", que dá para abrir (Ver) ou tirar do Início (X). O Próximo passo volta. */
function blocoConcluido(g) {
  return `<section class="bloco" aria-labelledby="tit-guia"><div class="faixa ${estado.verConcluidos ? '' : 'sem-linha'}" data-menu="guia"><div class="tit"><h2 class="tit-bloco" id="tit-guia">Primeiros passos ${selo('sucesso', 'Concluídos', 'check')}</h2><small class="num">${textoProgresso(g)} · também na Ajuda</small></div>
    <div class="acoes"><button class="btn fantasma anima" data-acao="ver-concluidos" aria-expanded="${estado.verConcluidos}">${estado.verConcluidos ? 'Esconder' : 'Ver'}</button>
    <button class="ib anima" data-acao="fechar-concluido" aria-label="Tirar os primeiros passos do Início">${ic('fechar')}</button></div></div>
    ${estado.verConcluidos ? `<div class="corpo">${listaPassos(g, false)}</div>` : ''}</section>`;
}

/* ====================== Próximo passo do Início ======================
   Some enquanto a lista está aberta (sem repetir o item nem o botão). Dispensada ou concluída, volta. */
function proximoDoInicio() {
  const g = guia();
  if (g.ativo && !g.concluido) return null;

/* ====================== render ====================== */
function aplicar() {
  const t = TEMAS[ajustes.tema] || TEMAS.claro, r = document.documentElement.style;
  for (const [k, v] of Object.entries(t)) r.setProperty('--' + k, v);
  if (ajustes.bordasReforcadas) r.setProperty('--borda', t.bordaCampo);
  r.setProperty('--bwBloco', ajustes.bordasReforcadas ? '3px' : '2px');
  r.setProperty('--marca', dados.cor); r.setProperty('--marcaTexto', ajustes.tema === 'escuro' ? '#F4F4F5' : dados.cor);
  r.setProperty('--largura', ['novo', 'marca'].includes(estado.tela) ? '880px' : estado.tela === 'ajuda' ? '1040px' : '1240px');
  r.colorScheme = ajustes.tema === 'escuro' ? 'dark' : 'light';
  const b = document.body.classList, cel = ajustes.celular || innerWidth < 768;
  b.toggle('cel', cel); b.toggle('simula-cel', ajustes.celular && innerWidth >= 768); b.toggle('editando', ajustes.editarTextos);
}

function render() {
  const foco = document.activeElement?.dataset?.k, ini = document.activeElement?.selectionStart;
  aplicar();
  const corpo = (TELAS[estado.tela] || telaInicio)();
  document.getElementById('app').innerHTML = `${menu()}<div class="principal">${topo()}<main class="conteudo">${corpo}</main>${inferior()}</div>`;
  painel(); desenharModal(); desenharPasseio();
  // Barra de progresso: anda do valor anterior ao novo (sem animação com movimento reduzido, pelo CSS).
  const barras = document.querySelectorAll('.barra-prog i');
  barras.forEach((el) => void el.offsetWidth);
  barras.forEach((el) => { el.style.width = el.dataset.p + '%'; });
  const g = guia(); ultimoProgresso = Math.round((g.feitos / g.total) * 100); ultimoProximo = g.proximo?.id ?? null;
  if (foco) { const el = document.querySelector(`[data-k="${CSS.escape(foco)}"]`); if (el) { el.focus(); try { el.setSelectionRange(ini, ini); } catch (e) {} } }
}
function aviso(t, acao) {

  clearTimeout(aviso.t); aviso.t = setTimeout(() => (c.innerHTML = ''), acao ? 10000 : 3500);
}
const ir = (tela, extra = {}) => { Object.assign(estado, { tela, menuUsuario: false, listaAberta: false }, extra); if (tela !== 'marca') estado.marcaForm = null; if (tela !== 'interessados') estado.linkForm = null; render(); scrollTo(0, 0); };
/* Muda os dados e, se um item dos primeiros passos ficou feito, avisa (com "Voltar ao Início", como o useAviso com ação). */
function mudar(fn) {
  const antes = guia(), feitosAntes = new Set(antes.lista.filter(resolvido).map((i) => i.id));
  fn(); guardar();
  const depois = guia(), novo = depois.lista.find((i) => resolvido(i) && !feitosAntes.has(i.id));
  if (novo && depois.ativo && antes.ativo) {
    if (depois.concluido) aviso('Primeiros passos concluídos. Tudo pronto para começar.', estado.tela === 'inicio' ? null : ['Voltar ao Início', 'ir', 'inicio']);
    else aviso(`Feito: ${novo.titulo}. ${textoProgresso(depois)} nos primeiros passos.`, estado.tela === 'inicio' ? null : ['Voltar ao Início', 'ir', 'inicio']);
    return true;
  }

}
function abrirItem(id) {

  if (id === 'modelo') return ir('planejamento', { aba: 'treino', chip: 'semanas' });
  if (id === 'aluno') return ir('novo', { form: { nome: '', email: '' }, tentou: false });
  if (id === 'convite') { const a = dados.alunos.find((x) => x.acesso === 'nenhum') || dados.alunos[0]; ir('ficha', { id: a.id }); const s = document.getElementById('sec-acesso'); if (s) scrollTo({ top: s.getBoundingClientRect().top + scrollY - 70 }); return; }
  if (id === 'link') return ir('interessados');
  if (id === 'passeio') { estado.passeio = 0; render(); }
}

/* ====================== eventos ====================== */
document.addEventListener('click', (ev) => {
  const ed = ev.target.closest('[data-ed]');
  if (ed) { if (ed.dataset.ed === 'salvar') textos[editId] = document.getElementById('texto-novo').value; if (ed.dataset.ed === 'original') delete textos[editId]; document.getElementById('camada-aviso').innerHTML = ''; guardar(); render(); return; }
  if (ev.target.closest('.editor-texto')) return;
  if (ajustes.editarTextos && ev.target.closest('[data-t]') && !ev.target.closest('.ajustes')) { ev.preventDefault(); abrirEditor(ev.target.closest('[data-t]')); return; }
  const aj = ev.target.closest('[data-aj]');
  if (aj) { const v = aj.dataset.v; ajustes[aj.dataset.aj] = v === 'true' ? true : v === 'false' ? false : v; guardar(); render(); return; }
  const el = ev.target.closest('[data-acao]');
  if (!el) { if (estado.menuUsuario) { estado.menuUsuario = false; render(); } return; }
  const a = el.dataset.acao, d = el.dataset;
  switch (a) {
    case 'nada': aviso('No protótipo só as telas do primeiro uso funcionam.'); return;
    case 'ir': return ir(d.v);
    case 'aj-ir': return d.v === 'ficha' && !dados.alunos.length ? (aviso('Cadastre um aluno primeiro (ou use "Membro novo").'), undefined) : ir(d.v, d.v === 'ficha' ? { id: dados.alunos[0].id } : {});
    case 'ir-novo': return ir('novo', { form: { nome: '', email: '' }, tentou: false });
    case 'abrir': return ir('ficha', { id: d.id });
    case 'item': return abrirItem(d.id);
    case 'conferido': mudar(() => { dados[d.id] = true; }); break;
    case 'nao-agora': mudar(() => { dados.linkNaoAgora = true; }); render(); aviso('Link de inscrição deixado para depois.', ['Desfazer', 'desfazer-nao-agora']); return;
    case 'desfazer-nao-agora': dados.linkNaoAgora = false; guardar(); render(); aviso('O link de inscrição voltou para a lista.'); return;
    case 'recolher': estado.recolhido = !estado.recolhido; break;
    case 'ver-todos': estado.listaAberta = !estado.listaAberta; break;
    case 'ver-concluidos': estado.verConcluidos = !estado.verConcluidos; break;
    case 'dispensar': estado.confirmar = true; break;
    case 'conf-cancelar': estado.confirmar = false; break;
    case 'conf-dispensar': estado.confirmar = false; dados.dispensado = true; guardar(); render(); aviso('Primeiros passos dispensados. Eles continuam na Ajuda.', ['Abrir Ajuda', 'ir', 'ajuda']); return;
    case 'fechar-concluido': dados.concluidoFechado = true; guardar(); break;
    case 'mostrar-de-novo': dados.dispensado = false; dados.concluidoFechado = false; guardar(); render(); aviso('Os primeiros passos voltaram ao Início.', ['Ir ao Início', 'ir', 'inicio']); return;
    case 'tentar': aviso('No app, busca de novo. Aqui, troque "Dados" no painel Ajustes.'); return;
    case 'menu-usuario': ev.stopPropagation(); estado.menuUsuario = !estado.menuUsuario; break;
    case 'salvar-aluno': {
      estado.tentou = true;
      if (!estado.form.nome.trim()) { render(); document.querySelector('.campo.erro')?.focus(); return; }
      const id = 'n' + Date.now(), nome = estado.form.nome.trim();
      const avisou = mudar(() => { dados.alunos.unshift({ id, nome, acesso: 'nenhum' }); });
      ir('ficha', { id });
      if (!avisou) aviso('Aluno criado. Para ele entrar no app, gere o convite em Acesso ao app.');
      return; }
    case 'gerar-convite': { estado.conviteDe = d.id; const x = dados.alunos.find((y) => y.id === d.id); mudar(() => { x.acesso = 'convite'; }); break; }
    case 'definir-senha': { const x = dados.alunos.find((y) => y.id === d.id); mudar(() => { x.acesso = 'aguardando'; }); break; }
    case 'copiar': aviso('Link copiado (fictício).'); return;
    case 'aba': estado.aba = d.v; estado.chip = ABAS[d.v][1][0][0]; break;
    case 'chip': estado.chip = d.v; break;
    case 'escolher-logo': estado.marcaForm.logo = true; break;
    case 'tirar-logo': estado.marcaForm.logo = false; break;
    case 'cor': estado.marcaForm.cor = d.v; break;
    case 'salvar-marca': { const m = estado.marcaForm; if (!mudar(() => Object.assign(dados, { logo: m.logo, cor: m.cor, nome: m.nome.trim() || dados.nome }))) aviso('Marca salva.'); break; }
    case 'ligar-link': estado.linkForm.ligado = !estado.linkForm.ligado; break;
    case 'salvar-link': { const l = estado.linkForm; if (!mudar(() => { dados.link = l.ligado; })) aviso(l.ligado ? 'Link de inscrição salvo.' : 'Link de inscrição salvo (desligado).'); break; }
    case 'passeio': estado.passeio = 0; break;
    case 'passeio-proximo': estado.passeio++; break;
    case 'passeio-anterior': estado.passeio = Math.max(0, estado.passeio - 1); break;
    case 'passeio-pular': estado.passeio = null; mudar(() => { dados.passeioVisto = true; }); break;
    case 'cenario': dados = d.v === 'membro' ? membroNovo() : consultoriaNova();
      if (d.v !== 'nova') dados.passeioVisto = true;
      if (['tudo', 'naoagora', 'dispensar', 'semalunos', 'parcial'].includes(d.v)) Object.assign(dados, { logo: true, metodologia: true, modelo: true });
      if (['tudo', 'naoagora', 'dispensar', 'parcial'].includes(d.v)) dados.alunos = [{ id: 'a1', nome: 'Ana Souza', acesso: d.v === 'tudo' ? 'ativo' : 'convite' }];
      if (d.v === 'tudo') dados.link = true;
      if (d.v === 'parcial') dados.link = true;
      if (d.v === 'naoagora') Object.assign(dados, { linkNaoAgora: true, modelo: false });
      if (d.v === 'semalunos') dados.dispensado = true;
      ajustes.estado = d.v === 'parcial' ? 'parcial' : 'normal';
      ajustes.perfil = d.v === 'restrito' ? 'restrito' : 'admin';
      estado.confirmar = d.v === 'dispensar';
      Object.assign(estado, { recolhido: false, verConcluidos: false, conviteDe: null, marcaForm: null, linkForm: null });
      ultimoProgresso = null; guardar(); ir('inicio'); return;
    case 'aj-abrir': ajAberto = true; break;
    case 'aj-fechar': ajAberto = false; exportado = ''; break;
    case 'aj-copiar': exportado = JSON.stringify({ tela: 'primeiro-uso', ajustes: { ...ajustes, celular: undefined, editarTextos: undefined, estado: undefined, perfil: undefined }, textos }, null, 1);
      try { navigator.clipboard.writeText(exportado).catch(() => {}); } catch (e) {} break;
    case 'aj-padrao': ajustes = { ...PADRAO }; textos = {}; guardar(); break;
    default: return;
  }
  render();
});
document.addEventListener('keydown', (ev) => {
  if (ev.target.id === 'texto-novo' && ev.key === 'Enter') { document.querySelector('[data-ed="salvar"]').click(); return; }
  if (ev.key !== 'Escape') return;
  if (estado.passeio !== null) { estado.passeio = null; dados.passeioVisto = true; guardar(); render(); }
  else if (estado.confirmar) { estado.confirmar = false; render(); }
  else if (ajAberto) { ajAberto = false; render(); }
  else if (estado.menuUsuario) { estado.menuUsuario = false; render(); }
});
document.addEventListener('input', (ev) => {
  const t = ev.target, c = t.dataset.campo; if (!c) return;
  if (c === 'nome' || c === 'email') estado.form[c] = t.value;
  if (c === 'marcaNome') estado.marcaForm.nome = t.value;
  render();
});
document.addEventListener('change', (ev) => { if (ev.target.dataset.campo === 'linkResp') estado.linkForm.resp = ev.target.value; });
let editId = null;
function abrirEditor(el) {
  editId = el.dataset.t; const r = el.getBoundingClientRect();
  document.getElementById('camada-aviso').innerHTML = `<div class="editor-texto" style="top:${Math.min(r.bottom + 6, innerHeight - 150)}px;left:${Math.max(8, Math.min(r.left, innerWidth - 330))}px"><b>Editar texto</b>
    <input id="texto-novo" value="${esc(textos[editId] ?? PADROES[editId] ?? el.textContent)}"><small style="color:#52525B">Original: ${esc(PADROES[editId] || '')}</small>
    <div class="lb"><button class="forte" data-ed="salvar">Salvar</button><button data-ed="original">Voltar ao original</button><button data-ed="cancelar">Cancelar</button></div></div>`;
  const i = document.getElementById('texto-novo'); i.focus(); i.select();
}
addEventListener('resize', () => { clearTimeout(window.__r); window.__r = setTimeout(render, 120); });
render();
/* Primeiro acesso: o passeio abre sozinho no Início, antes e sozinho, como hoje depois do aceite dos termos. */
if (!dados.passeioVisto && estado.tela === 'inicio') { estado.passeio = 0; render(); }
</script>
</body>
</html>

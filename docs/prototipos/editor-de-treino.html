<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo · Editor de treino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Protótipo do editor de treino (30/10/2026). Dados fictícios. Nada aqui fala com a API. */
:root { --fonte: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--fonte); background: var(--fundo); color: var(--texto); font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num-tab { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: no-preference) {
  .anima { transition: background-color .12s, border-color .12s, transform .08s; }
  .anima:active:not(:disabled) { transform: scale(.97); }
}
:focus-visible { outline: 2px solid var(--texto); outline-offset: 2px; }

/* ---------- moldura geral ---------- */
#app { display: flex; min-height: 100vh; background: var(--fundo); }
body.simula-cel #app { max-width: 390px; margin: 16px auto; min-height: calc(100vh - 32px); border: 1px solid var(--borda); border-radius: 20px; overflow: hidden; position: relative; }
.principal { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* menu lateral */
.menu { width: 240px; flex-shrink: 0; background: var(--sup); border-right: 1px solid var(--borda); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.menu.trilho { width: 68px; }
.menu .logo { height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--borda); }
.menu .logo .q { width: 32px; height: 32px; border-radius: 8px; background: var(--marca); color: #fff; display: grid; place-items: center; flex-shrink: 0; }
.menu .logo b { display: block; font-size: 15px; }
.menu .logo small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); }
.menu nav { padding: 8px; display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
.menu .grupo { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); padding: 12px 10px 4px; }
.menu.trilho .grupo { display: none; }
.item-menu { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: var(--raio); color: var(--suave); text-decoration: none; border: 0; background: none; width: 100%; text-align: left; }
.item-menu:hover { background: var(--sup3); color: var(--texto); }
.item-menu.ativo { background: var(--ativoFundo); color: var(--ativoTexto); font-weight: 600; }
.menu.trilho .item-menu { justify-content: center; padding: 0; }
.menu.trilho .item-menu span, .menu.trilho .logo div { display: none; }
.menu .rodape { border-top: 1px solid var(--borda); padding: 8px; }

/* topo */
.topo { height: 60px; display: flex; align-items: center; gap: 16px; padding: 0 24px; background: var(--sup); border-bottom: 1px solid var(--borda); }
.busca { flex: 1; max-width: 520px; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 1px solid var(--bordaCampo); border-radius: var(--raio); background: var(--campo); color: var(--suave); }
.busca kbd { margin-left: auto; font-size: 11px; border: 1px solid var(--borda); border-radius: 4px; padding: 1px 6px; }
.topo .dir { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.usuario { display: flex; align-items: center; gap: 10px; border: 1px solid var(--borda); border-radius: var(--raio); padding: 6px 12px; background: var(--sup); }
.usuario b { display: block; font-size: 13px; }
.usuario small { color: var(--suave); font-size: 12px; }

/* barra do editor (fixa) */
.barra-editor { position: sticky; top: 0; z-index: 20; background: var(--sup); border-bottom: 1px solid var(--borda); padding: 10px 24px; display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
.barra-editor .estado { display: flex; flex-direction: column; gap: 4px; }
.barra-editor .estado small { color: var(--suave); font-size: 12px; }
.barra-editor .acoes { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* conteúdo */
.conteudo { width: 100%; max-width: 1040px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 24px; }
.trilha { display: flex; align-items: center; gap: 6px; color: var(--suave); font-size: 13px; flex-wrap: wrap; }
.trilha b { color: var(--texto); font-weight: 600; }
.titulo-tela { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 24px; line-height: 30px; margin: 0; letter-spacing: -.01em; }
.contadores { display: flex; gap: 8px; flex-wrap: wrap; }
.contador { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid var(--borda); border-radius: var(--raio); background: var(--sup); color: var(--suave); font-size: 13px; }
.contador b { color: var(--texto); }
button.contador:hover { background: var(--sup3); }

/* botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: var(--raio); border: 1px solid var(--borda); background: var(--sup); font-weight: 600; font-size: 14px; }
.btn:hover { background: var(--sup3); }
.btn.primario { background: var(--marca); border-color: var(--marca); color: #fff; }
.btn.primario:hover { filter: brightness(.92); }
.btn.fantasma { border-color: transparent; background: transparent; }
.btn.fantasma:hover { background: var(--sup3); }
.btn.tracejado { border-style: dashed; border-color: var(--bordaCampo); background: transparent; width: 100%; color: var(--texto); }
.btn.perigo { color: var(--perigo); }
.ib { width: 36px; height: 36px; display: inline-grid; place-items: center; border-radius: var(--raio); border: 1px solid transparent; background: transparent; color: var(--suave); }
body.moldura .ib { border-color: var(--borda); background: var(--sup); color: var(--texto); }
.ib:hover:not(:disabled) { background: var(--sup3); color: var(--texto); }
.ib:disabled { opacity: .35; cursor: default; }
.ib.perigo { color: var(--perigo); }
body.cel .ib, body.cel .btn { min-height: 44px; }
body.cel .ib { width: 44px; height: 44px; }

/* selos */
.selo { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid var(--c); color: var(--c); background: color-mix(in srgb, var(--c) 11%, transparent); }
.selo.caixa { text-transform: uppercase; letter-spacing: .05em; font-size: 11px; font-weight: 700; }
.selo.sucesso { --c: var(--sucesso); } .selo.atencao { --c: var(--atencao); } .selo.perigo { --c: var(--perigo); } .selo.neutro { --c: var(--suave); }
body.sem-selos .selo.sucesso, body.sem-selos .selo.atencao, body.sem-selos .selo.perigo { --c: var(--suave); }
.etiqueta { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border: 1px solid var(--borda); border-radius: 6px; font-size: 12px; color: var(--suave); background: var(--sup); white-space: nowrap; }

/* blocos */
.bloco { background: var(--sup); border: var(--bwBloco) solid var(--borda); border-radius: var(--raio); overflow: hidden; }
.faixa { background: var(--faixa); border-bottom: var(--linhaFaixa) solid var(--linhaCor); padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.faixa .tit { flex: 1; min-width: 180px; display: flex; flex-direction: column; gap: 2px; }
.faixa .tit b { font-size: 16px; }
.faixa .tit small { color: var(--suave); font-size: 13px; }
.faixa .acoes { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.corpo { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.sessao { border-left: var(--barraLarg) solid var(--barraCor); }
.exercicio.com-erro { border-color: var(--perigo); }
.exercicio .faixa { background: var(--faixaEx); }
.exercicio .faixa .tit b { font-size: 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.exercicio.fechado .faixa { border-bottom: 0; }
.alca { color: var(--suave); display: inline-grid; cursor: grab; }

.rotulo { font-size: 13px; font-weight: 600; margin-bottom: 6px; display: block; }
.secao-titulo { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); display: flex; align-items: center; gap: 8px; }
.secao-titulo .extra { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 13px; }
.linha { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.linha > .cresce { flex: 1; min-width: 200px; }
.divisor { height: 1px; background: var(--divisor); border: 0; margin: 0; }
.campo { height: 40px; min-width: 0; width: 100%; border: 1px solid var(--bordaCampo); background: var(--campo); border-radius: var(--raio); padding: 0 12px; color: var(--texto); }
.campo.curto { width: 96px; }
textarea.campo { height: 72px; padding: 10px 12px; resize: vertical; }
.campo.erro { border: 2px solid var(--perigo); }
.msg-erro { color: var(--perigo); font-size: 12px; margin-top: 4px; display: block; }
.msg-aviso { color: var(--atencao); font-size: 12px; margin-top: 4px; display: block; }
.sufixo { display: flex; align-items: stretch; }
.sufixo .campo { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.sufixo span { display: grid; place-items: center; padding: 0 10px; border: 1px solid var(--bordaCampo); border-left: 0; border-radius: 0 var(--raio) var(--raio) 0; background: var(--sup3); color: var(--suave); font-size: 13px; }
select.campo { width: auto; padding-right: 28px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 36px; padding: 0 12px; border-radius: var(--raio); border: 1px solid var(--borda); background: var(--sup); font-weight: 600; font-size: 13px; }
.chip:hover { background: var(--sup3); }
.chip.sel { background: var(--texto); color: var(--fundo); border-color: var(--texto); }
.chip.tracejado { border-style: dashed; border-color: var(--bordaCampo); background: transparent; }
body.cel .chip { min-height: 44px; }
.passo { display: inline-flex; align-items: center; border: 1px solid var(--bordaCampo); border-radius: var(--raio); background: var(--campo); height: 40px; }
.passo button { width: 40px; height: 100%; border: 0; background: none; font-size: 18px; }
.passo button:disabled { opacity: .3; }
.passo b { min-width: 32px; text-align: center; }
.link { background: none; border: 0; padding: 0; color: var(--texto); text-decoration: underline; font-size: 13px; display: inline-flex; gap: 4px; align-items: center; }
.explicacao { font-size: 13px; color: var(--suave); background: var(--sup2); border-left: 3px solid var(--borda); padding: 8px 12px; border-radius: 0 6px 6px 0; }

/* séries */
.series { display: flex; flex-direction: column; gap: 8px; }
.serie { border: var(--bwItem) solid var(--borda); border-radius: var(--raio); background: var(--sup2); overflow: hidden; }
.serie.aberta { border-color: var(--bordaCampo); background: var(--sup); }
.serie.com-erro { border-color: var(--perigo); }
.serie-cab { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 12px; flex-wrap: wrap; cursor: pointer; }
.serie.aberta .serie-cab { background: var(--faixa); border-bottom: 1px solid var(--linhaCor); }
.serie-cab .resumo { flex: 1; min-width: 200px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.serie-cab .resumo b { font-size: 14px; }
.serie-cab .det { color: var(--suave); font-size: 13px; }
.serie-cab .acoes { display: flex; gap: 6px; align-items: center; margin-left: auto; }
.numero { width: 26px; height: 26px; border-radius: 6px; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; border: 1px solid var(--bordaCampo); background: var(--sup); flex-shrink: 0; }
.serie.aberta .numero { background: var(--texto); color: var(--fundo); border-color: var(--texto); }
body.sem-numeros .numero { display: none; }
.serie-corpo { padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.poco { background: var(--sup2); border: 1px solid var(--divisor); border-radius: var(--raio); padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
.lado { display: grid; grid-template-columns: 3fr 2fr; gap: 12px; }
body.cel .lado { grid-template-columns: 1fr; }
.previa { border-radius: var(--raio); padding: 12px 14px; border: 1px solid var(--borda); background: var(--sup2); display: flex; flex-direction: column; gap: 6px; }
body.previa-cor .previa.sucesso { border-color: color-mix(in srgb, var(--sucesso) 45%, transparent); background: color-mix(in srgb, var(--sucesso) 8%, var(--sup)); }
body.previa-cor .previa.atencao { border-color: color-mix(in srgb, var(--atencao) 45%, transparent); background: color-mix(in srgb, var(--atencao) 8%, var(--sup)); }
body.previa-cor .previa.perigo { border-color: color-mix(in srgb, var(--perigo) 45%, transparent); background: color-mix(in srgb, var(--perigo) 7%, var(--sup)); }
.previa ul { margin: 0; padding-left: 18px; font-size: 13px; }
.nova-serie { border: 1px dashed var(--bordaCampo); border-radius: var(--raio); padding: 14px; display: flex; flex-direction: column; gap: 12px; background: var(--sup); }
.vazio { color: var(--suave); font-size: 13px; padding: 4px 0; }

/* abas das sessões */
.abas-sessao { display: flex; gap: 8px; flex-wrap: wrap; }

/* próximo movimento */
.proximo { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 16px; border: 1px dashed var(--bordaCampo); border-radius: var(--raio); background: var(--sup); }
.proximo .q { width: 40px; height: 40px; border-radius: var(--raio); border: 1px solid var(--borda); display: grid; place-items: center; }
.proximo .tx { flex: 1; min-width: 200px; }
.proximo .tx b { display: block; }
.proximo .tx small { color: var(--suave); }

/* barra inferior do celular */
.inferior { display: none; }
body.cel .menu, body.cel .topo { display: none; }
body.cel .inferior { display: flex; position: sticky; bottom: 0; background: var(--sup); border-top: 1px solid var(--borda); }
.inferior button { flex: 1; border: 0; background: none; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--suave); }
.inferior button.ativo { color: var(--marcaTexto); font-weight: 700; }
body.cel .barra-editor { padding: 10px 12px; }
body.cel .conteudo { padding: 16px 12px; }
body.cel .barra-editor .acoes { margin-left: 0; width: 100%; }
body.cel .barra-editor .acoes .btn { flex: 1; padding: 0 8px; }
body.cel .lbl-longo { display: none; }
body.cel .faixa .acoes { margin-left: auto; }
.ajustes .fechar { width: 36px; height: 36px; border: 1px solid #B9B9C0; border-radius: 8px; background: #fff; color: #111114; display: grid; place-items: center; }

/* painel de ajustes */
.abrir-ajustes { position: fixed; right: 16px; bottom: 16px; z-index: 60; background: #111114; color: #fff; border: 0; border-radius: 999px; height: 48px; padding: 0 18px; display: flex; align-items: center; gap: 8px; font-weight: 700; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
.ajustes { position: fixed; top: 0; right: 0; bottom: 0; width: 340px; max-width: 100vw; z-index: 70; background: #FFFFFF; color: #111114; border-left: 1px solid #B9B9C0; display: flex; flex-direction: column; font-size: 13px; }
.ajustes header { padding: 14px 16px; border-bottom: 1px solid #D4D4D8; display: flex; align-items: center; gap: 8px; background: #F4F4F5; }
.ajustes header b { flex: 1; font-size: 15px; }
.ajustes .lista { overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.ajustes .op b { display: block; margin-bottom: 6px; font-size: 12px; }
.ajustes .op small { display: block; color: #52525B; margin-top: 4px; }
.ajustes .opcoes { display: flex; gap: 6px; flex-wrap: wrap; }
.ajustes .opcoes button { border: 1px solid #B9B9C0; background: #fff; color: #111114; border-radius: 8px; padding: 6px 10px; font-weight: 600; font-size: 12px; }
.ajustes .opcoes button.sel { background: #111114; color: #fff; border-color: #111114; }
.ajustes input[type=color] { width: 44px; height: 32px; border: 1px solid #B9B9C0; border-radius: 6px; padding: 2px; background: #fff; }
.ajustes footer { border-top: 1px solid #D4D4D8; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.ajustes footer button { border: 1px solid #B9B9C0; background: #fff; color: #111114; border-radius: 8px; min-height: 38px; font-weight: 700; }
.ajustes footer button.forte { background: #111114; color: #fff; border-color: #111114; }
.ajustes textarea { width: 100%; height: 120px; font-family: ui-monospace, monospace; font-size: 11px; border: 1px solid #B9B9C0; border-radius: 6px; }
.ajustes h4 { margin: 8px 0 0; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #52525B; }

@media (min-width: 900px) { body.com-ajustes #app { margin-right: 340px; } body.com-ajustes.simula-cel #app { margin-right: auto; transform: translateX(-170px); } }
/* modo editar textos */
body.editando [data-t] { outline: 1px dashed #2563eb; outline-offset: 1px; cursor: text; border-radius: 3px; }
body.editando [data-t]:hover { background: rgba(37,99,235,.10); }
.editor-texto { position: fixed; z-index: 90; background: #fff; color: #111114; border: 1px solid #2563eb; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; width: 320px; max-width: calc(100vw - 16px); box-shadow: 0 6px 24px rgba(0,0,0,.2); font-size: 13px; }
.editor-texto input { height: 36px; border: 1px solid #8A8A93; border-radius: 6px; padding: 0 10px; font: inherit; }
.editor-texto .linha-b { display: flex; gap: 6px; }
.editor-texto button { border: 1px solid #B9B9C0; background: #fff; border-radius: 6px; padding: 6px 10px; font-weight: 700; }
.editor-texto button.forte { background: #111114; color: #fff; border-color: #111114; }

.aviso-flutuante { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); z-index: 80; background: #111114; color: #fff; border-radius: 10px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; font-size: 13px; max-width: calc(100vw - 32px); }
.aviso-flutuante button { background: none; border: 1px solid #fff; color: #fff; border-radius: 6px; padding: 4px 10px; font-weight: 700; }
.alerta { border: 1px solid var(--c); color: var(--c); background: color-mix(in srgb, var(--c) 9%, var(--sup)); border-radius: var(--raio); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.alerta.perigo { --c: var(--perigo); } .alerta.sucesso { --c: var(--sucesso); }
.alerta ul { margin: 0; padding-left: 18px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="camada-ajustes"></div>
<div id="camada-aviso"></div>
<script>
'use strict';
/* ====================== cores (iguais a app/src/tema/tokens.ts) ====================== */
const TEMAS = {
  claro: { fundo:'#EAEAED', sup:'#FFFFFF', sup2:'#F4F4F5', sup3:'#E7E7EA', divisor:'#D4D4D8', borda:'#B9B9C0', campo:'#FFFFFF', bordaCampo:'#8A8A93', texto:'#111114', suave:'#52525B', sucesso:'#176E3C', atencao:'#875710', perigo:'#B71C1C', faixaForte:'#DCDCE1' },
  areia: { fundo:'#F2F0EB', sup:'#FFFFFF', sup2:'#F7F5F0', sup3:'#E7E3DB', divisor:'#DDD8CF', borda:'#B9B3A9', campo:'#FFFFFF', bordaCampo:'#77736B', texto:'#111114', suave:'#52525B', sucesso:'#176E3C', atencao:'#875710', perigo:'#B71C1C', faixaForte:'#DDD6CA' },
  escuro: { fundo:'#0A0A0C', sup:'#18181B', sup2:'#222226', sup3:'#2C2C31', divisor:'#36363C', borda:'#4C4C55', campo:'#0F0F12', bordaCampo:'#63636B', texto:'#F4F4F5', suave:'#A1A1AA', sucesso:'#2BB36A', atencao:'#D9962C', perigo:'#F0666B', faixaForte:'#34343B' },
};
const PADRAO = {
  tema:'claro', fundo:'claro', marca:'#B71C1C', barra:'marca', barraLarg:4, bwBloco:2, linhaFaixa:2, bwItem:1, faixas:'fortes', raio:8,
  selos:true, previaCor:true, numeros:true, moldura:true, umaAberta:true, menuAtivo:'escuro', celular:false, editarTextos:false, menuRecolhido:false,
};
let ajustes = Object.assign({}, PADRAO);
let textos = {};
try { const s = JSON.parse(localStorage.getItem('prototipo-editor-ajustes') || 'null'); if (s) { ajustes = Object.assign({}, PADRAO, s.ajustes || {}); textos = s.textos || {}; } } catch (e) {}
function guardar() { try { localStorage.setItem('prototipo-editor-ajustes', JSON.stringify({ ajustes, textos })); } catch (e) {} }

/* ====================== ícones (desenho do lucide, o mesmo do app) ====================== */

/* ====================== render e eventos ====================== */
function render() {
  const foco = document.activeElement?.dataset?.k, ini = document.activeElement?.selectionStart, fim = document.activeElement?.selectionEnd;
  aplicarTema();
  document.getElementById('app').innerHTML = `${menu()}<div class="principal">${topo()}${barraEditor()}<main class="conteudo">${cabecalhoTela()}${configuracao()}${abasSessao()}${cartaoSessao()}</main>${barraInferior()}</div>`;
  painelAjustes();
  if (foco) { const el = document.querySelector(`[data-k="${CSS.escape(foco)}"]`); if (el) { el.focus(); try { el.setSelectionRange(ini, fim); } catch (e) {} } }
}
function irAo(id) { requestAnimationFrame(() => { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }); }
function hora() { const d = new Date(); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; }
function guardarParaDesfazer(texto) { desfazer = JSON.stringify(estado); aviso(texto, 'Desfazer'); }

document.addEventListener('click', (ev) => {
  if (ev.target.closest('.editor-texto')) { acaoEditorTexto(ev); return; }
  if (ajustes.editarTextos && ev.target.closest('[data-t]') && !ev.target.closest('.ajustes')) { ev.preventDefault(); abrirEditorTexto(ev.target.closest('[data-t]')); return; }
  const aj = ev.target.closest('[data-aj]');
  if (aj) {
    const k = aj.dataset.aj, v = aj.dataset.v;
    ajustes[k] = v === 'true' ? true : v === 'false' ? false : (typeof PADRAO[k] === 'number' ? Number(v) : v);
    if (k === 'umaAberta') { estado.abertas = {}; }
    guardar(); render(); return;
  }
  const el = ev.target.closest('[data-acao]'); if (!el) return;
  const a = el.dataset.acao, d = el.dataset;
  if (el.closest('.serie-cab') && a === 'serie-toggle' && ev.target.closest('.acoes button') && ev.target.closest('.acoes button') !== el) return;
  switch (a) {
    case 'aj-abrir': ajustesAbertos = true; break;
    case 'aj-fechar': ajustesAbertos = false; exportado = ''; break;
    case 'aj-copiar': {
      const mud = {}; for (const k of Object.keys(PADRAO)) if (ajustes[k] !== PADRAO[k] && !['celular', 'editarTextos', 'menuRecolhido'].includes(k)) mud[k] = ajustes[k];
      exportado = JSON.stringify({ ajustes: Object.assign({}, ajustes, { celular: undefined, editarTextos: undefined, menuRecolhido: undefined }), mudadosDoPadrao: mud, textos }, null, 1);
      try { navigator.clipboard.writeText(exportado).catch(() => {}); } catch (e) {}
      break; }
    case 'aj-padrao': ajustes = Object.assign({}, PADRAO); textos = {}; guardar(); aviso('Ajustes e textos voltaram ao padrão.'); break;
    case 'aj-dados': estado = dadosIniciais(); aviso('Dados de exemplo recomeçados.'); break;
    case 'menu-recolher': ajustes.menuRecolhido = !ajustes.menuRecolhido; guardar(); break;
    case 'menu-item': aviso('No protótipo só o editor de treino funciona.'); return;
    case 'sessao': estado.sessaoAtiva = Number(d.i); estado.novaSerie = null; break;
    case 'nova-sessao': estado.sessoes.push({ id:novoId(), nome:'Nova sessão', dia:'Sex', tipo:'Treino', obs:'', obsAberta:false, exercicios:[] }); estado.sessaoAtiva = estado.sessoes.length - 1; mudou(); break;
    case 'sessao-del': guardarParaDesfazer(`Sessão "${sessao().nome}" removida.`); estado.sessoes.splice(estado.sessaoAtiva, 1); estado.sessaoAtiva = 0; mudou(); break;
    case 'obs': sessao().obsAberta = !sessao().obsAberta; break;
    case 'todos': sessao().exercicios.forEach((e) => { e.aberto = d.v === 'abrir'; }); break;
    case 'cfg': estado.configAberta = !estado.configAberta; break;
    case 'ex-toggle': { const { e } = acharEx(d.e); e.aberto = !e.aberto; break; }
    case 'ex-mover': { const lista = sessao().exercicios, i = lista.findIndex((x) => x.id === d.e), j = i + Number(d.v); [lista[i], lista[j]] = [lista[j], lista[i]]; mudou(); irAo('ex-' + d.e); break; }
    case 'ex-del': { const lista = sessao().exercicios, i = lista.findIndex((x) => x.id === d.e); guardarParaDesfazer(`Exercício "${lista[i].nome}" removido.`); lista.splice(i, 1); mudou(); break; }
    case 'ex-trocar': aviso('No app abre a biblioteca para escolher outro exercício. As séries ficam.'); return;
    case 'ex-set': { const { e } = acharEx(d.e); e[d.campo] = d.v; mudou(); break; }
    case 'serie-toggle': alternarSerie(d.s); break;
    case 'serie-mover': { const { e, i } = acharSerie(d.s), j = i + Number(d.v); [e.series[i], e.series[j]] = [e.series[j], e.series[i]]; mudou(); break; }
    case 'serie-del': { const { e, i, s } = acharSerie(d.s); guardarParaDesfazer(`Série "${titulo(s)}" removida.`); e.series.splice(i, 1); mudou(); break; }
    case 'serie-set': { const { s } = acharSerie(d.s); s[d.campo] = d.v;
      if (d.campo === 'tecnica' && d.v === 'CLUSTER') s.repsForma = 'EXATA';
      if (d.campo === 'esforco' && d.v === 'RIR' && !s.rir) s.rir = '1';
      mudou(); break; }
    case 'qtd': { const { s } = acharSerie(d.s); s.qtd = Math.max(1, Math.min(30, s.qtd + Number(d.v))); mudou(); break; }
    case 'explicar': estado.explicar[d.v] = !estado.explicar[d.v]; break;
    case 'nova-serie': estado.novaSerie = { e: d.e, tipo: null, tec: 'NENHUMA' }; break;
    case 'nova-tipo': estado.novaSerie.tipo = d.v; break;
    case 'nova-tec': estado.novaSerie.tec = d.v; break;
    case 'nova-cancelar': estado.novaSerie = null; break;
    case 'nova-ok': { const { e } = acharEx(estado.novaSerie.e), n = estado.novaSerie;
      const s = serie({ tipo: n.tipo, tecnica: n.tec, repsForma: n.tec === 'CLUSTER' ? 'EXATA' : 'FAIXA',
        cargaModo: n.tipo === 'AQUEC' ? 'NENHUMA' : n.tipo === 'BACK' ? 'PERCENTUAL_WS' : n.tipo === 'TOP' ? 'ACIMA_DA_ANTERIOR' : n.tipo === 'FS' ? 'PERCENTUAL_WS' : 'CARGA_TRABALHO',
        esforco: n.tipo === 'AQUEC' || n.tipo === 'FS' ? 'NENHUM' : 'RIR', pMin: n.tipo === 'BACK' ? '85' : '' });
      e.series.push(s); estado.novaSerie = null; abrirSerie(s.id); mudou(); irAo('s-' + s.id); break; }
    case 'add-ex': { const e = exercicio({ series: [] }); sessao().exercicios.push(e); mudou(); render();
      const el2 = document.querySelector(`[data-k="${e.id}.nome"]`); if (el2) { el2.focus(); el2.select(); el2.scrollIntoView({ block: 'center' }); } return; }
    case 'modelos': aviso('No app abre a Folha "Modelos" (sessões e exercícios prontos).'); return;
    case 'salvar': estado.salvoAs = hora(); estado.alterado = false; aviso('Rascunho salvo (protótipo: nada sai deste navegador).'); break;
    case 'validar': estado.mostrarProblemas = true; if (!problemas().length) aviso('Tudo certo para publicar.'); break;
    case 'publicar': if (problemas().length) { estado.mostrarProblemas = true; aviso('Corrija os problemas antes de publicar.'); }
      else { estado.publicado = hora(); estado.mostrarProblemas = false; aviso('Publicado (protótipo). O aluno passaria a ver esta versão.'); } break;
    case 'pdf': aviso('No app gera o PDF do rascunho.'); return;
    case 'ir-problema': { const p = problemas()[0]; if (!p) break; estado.mostrarProblemas = true; estado.sessaoAtiva = p.si; p.e.aberto = true; abrirSerie(p.s.id); render(); irAo('s-' + p.s.id); return; }
    case 'desfazer': if (desfazer) { estado = JSON.parse(desfazer); desfazer = null; document.getElementById('camada-aviso').innerHTML = ''; } break;
    default: return;
  }
  render();
});
document.addEventListener('input', (ev) => {
  const t = ev.target;

/* modo "Editar textos": uma caixinha abre perto do texto clicado */

function acaoEditorTexto(ev) {

  if (b.dataset.ed === 'salvar') { textos[editandoId] = document.getElementById('texto-novo').value; }
  if (b.dataset.ed === 'original') { delete textos[editandoId]; }
  document.getElementById('camada-aviso').innerHTML = ''; editandoId = null; guardar(); render();
}
document.addEventListener('keydown', (ev) => {
  if (ev.target.id === 'texto-novo' && ev.key === 'Enter') { ev.preventDefault(); document.querySelector('[data-ed="salvar"]').click(); return; }
  if (ev.target.id === 'texto-novo' && ev.key === 'Escape') { document.querySelector('[data-ed="cancelar"]').click(); return; }
  if (ev.key === 'Escape' && ajustesAbertos) { ajustesAbertos = false; render(); }
});
window.addEventListener('resize', () => { clearTimeout(window.__r); window.__r = setTimeout(render, 120); });
render();
</script>

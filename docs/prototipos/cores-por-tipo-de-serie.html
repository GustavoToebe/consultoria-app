<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo · Cores por tipo de série</title>
<style>
/* Protótipo da Frente G (reunião de 30/10: C35, C50/C74, C45, C16), 03/11/2026. Dados fictícios (D8). Nada aqui fala com a
   API. Autocontido: sem fonte nem script de fora. As cores dos temas são as de app/src/tema/tokens.ts. */
:root { --fonte: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; --raio: 12px; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--fonte); background: #E9E9EC; color: #111114; font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }

/* ====== moldura do protótipo (fora do app; cores fixas) ====== */
.barra-prot { position: sticky; top: 0; z-index: 50; background: #111114; color: #fff; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.barra-prot b.tit { font-size: 14px; margin-right: 8px; }
.grupo-prot { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.grupo-prot > span { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #A1A1AA; }
.grupo-prot button { border: 1px solid #52525B; background: #18181B; color: #F4F4F5; border-radius: 8px; padding: 5px 10px; font-size: 12px; font-weight: 600; }
.grupo-prot button.sel { background: #F4F4F5; color: #111114; border-color: #F4F4F5; }
.doc { max-width: 1340px; margin: 0 auto; padding: 20px 16px 48px; display: flex; flex-direction: column; gap: 20px; }
.caixa-doc { background: #fff; border: 1px solid #C9C9CF; border-radius: 12px; padding: 18px 20px; }
.caixa-doc h2 { margin: 0 0 10px; font-size: 18px; }
.caixa-doc h3 { margin: 16px 0 6px; font-size: 14px; }
.caixa-doc p { margin: 6px 0; }
.caixa-doc ol { margin: 6px 0 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
.caixa-doc small { color: #52525B; }
.decisao b { display: block; }
.decisao .op { color: #3F3F46; }
.rec { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: #111114; color: #fff; margin-left: 4px; vertical-align: 1px; }
.palco { overflow-x: auto; padding: 4px 0 8px; }
.rotulo-palco { font-size: 12px; color: #52525B; margin-bottom: 6px; }
table.cont { border-collapse: collapse; width: 100%; font-size: 13px; }
table.cont th, table.cont td { border-bottom: 1px solid #E4E4E7; padding: 6px 8px; text-align: left; white-space: nowrap; }
table.cont th { font-size: 12px; color: #52525B; }
table.cont td.ok { color: #176E3C; font-weight: 700; }
table.cont td.falha { color: #B71C1C; font-weight: 700; }
.amostra { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; border: 1px solid rgba(0,0,0,.2); }
.tabelas-cont { display: grid; grid-template-columns: 1fr; gap: 16px; }
.tabelas-cont .t { border: 1px solid #E4E4E7; border-radius: 10px; padding: 10px; overflow-x: auto; }
.tabelas-cont .t.atual { border: 2px solid #111114; }
.tabelas-cont h4 { margin: 0 0 6px; font-size: 13px; }
.resumo-cont { margin-top: 10px; font-weight: 600; }

/* ====== o aparelho (tema do app) ====== */
.disp { background: var(--fundo); color: var(--texto); border: 1px solid #A1A1AA; border-radius: 14px; overflow: hidden; margin: 0 auto; position: relative; display: flex; flex-direction: column; min-height: 760px; }
.disp.l390 { width: 390px; border-radius: 28px; }
.disp.l1280 { width: 1280px; }
.disp .barra-sis { height: 26px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-size: 11px; color: var(--suave); background: var(--sup); }
.disp.l1280 .barra-sis { display: none; }
.app { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.conteudo { width: 100%; max-width: 720px; margin: 0 auto; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 16px; flex: 1; }
.disp.l1280 .conteudo { padding: 28px 24px; gap: 24px; }
h1 { font-size: 24px; line-height: 30px; margin: 0; letter-spacing: -.01em; }
.suave { color: var(--suave); }
.pequeno { font-size: 12px; color: var(--suave); }
.forte { font-weight: 600; }
.cab { display: flex; align-items: center; gap: 10px; }
.cab .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ib { width: 44px; height: 44px; display: inline-grid; place-items: center; border-radius: var(--raio); border: 1px solid var(--bordaCampo); background: var(--sup); color: var(--texto); flex-shrink: 0; }
.ib.p { width: 36px; height: 36px; border-color: var(--borda); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: var(--raio); border: 1px solid var(--borda); background: var(--sup); font-weight: 600; white-space: nowrap; color: var(--texto); }
.btn.primario { background: var(--marca); border-color: var(--marca); color: #fff; }
.btn.cheio { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.fantasma { background: transparent; border-color: transparent; text-decoration: underline; }
.bloco { background: var(--sup); border: 2px solid var(--borda); border-radius: var(--raio); overflow: hidden; }
.faixa { background: var(--sup3); border-bottom: 3px solid var(--bordaCampo); padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.faixa .tit { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 2px; }
.faixa .tit b { font-size: 16px; }
.corpo { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.selo { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; border: 1px solid var(--c); color: var(--c); background: var(--ct); }
.selo.neutro { --c: var(--texto); --ct: var(--sup); border-color: var(--bordaCampo); font-weight: 600; }
.periodo { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--texto); border: 1px solid var(--bordaCampo); border-radius: 999px; padding: 3px 10px; background: var(--sup); }
.abas { display: flex; gap: 4px; border-bottom: 1px solid var(--divisor); }
.abas button { border: 0; background: none; padding: 10px 12px; min-height: 44px; font-weight: 600; color: var(--suave); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.abas button.sel { color: var(--texto); border-bottom-color: var(--bordaCampo); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 0 14px; border-radius: var(--raio); border: 1px solid var(--borda); background: var(--sup); font-weight: 600; font-size: 13px; color: var(--texto); }
.chip.sel { background: var(--texto); color: var(--fundo); border-color: var(--texto); }
.campo { height: 48px; width: 96px; border: 1px solid var(--bordaCampo); background: var(--campo); border-radius: var(--raio); padding: 0 10px; color: var(--texto); font-size: 18px; font-weight: 600; text-align: right; }
.campo.busca { width: 100%; font-size: 14px; font-weight: 400; text-align: left; height: 44px; }
.rot-campo { font-size: 12px; font-weight: 600; display: block; margin-bottom: 4px; }
.inferior { display: flex; background: var(--sup); border-top: 1px solid var(--borda); max-width: 720px; width: 100%; margin: 0 auto; }
.inferior button { flex: 1; border: 0; background: none; min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--suave); }
.inferior button.ativo { color: var(--marcaTexto); font-weight: 700; }

/* ====== execução: cartão da série com a cor do tipo ====== */
.faixa-treino { display: flex; gap: 8px; flex-wrap: wrap; }
.faixa-treino div { flex: 1; min-width: 96px; border: 1px solid var(--borda); background: var(--sup); border-radius: var(--raio); padding: 8px 12px; }
.faixa-treino small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); }
.faixa-treino b { font-size: 16px; }
.serie { background: var(--sup); border: 2px solid var(--borda); border-radius: var(--raio); overflow: hidden; position: relative; }
.serie.m-barra { border-left: 6px solid var(--c); }
.serie.m-tingido { background: var(--ct); border-color: var(--c); }
.serie.m-faixa .topo-serie { background: var(--ct); border-bottom: 3px solid var(--c); }
.serie.sem-cor.m-barra { border-left-color: var(--borda); }
.topo-serie { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 14px 0; }
.serie.m-faixa .topo-serie { padding: 10px 14px; }
.topo-serie .n { margin-left: auto; font-size: 12px; color: var(--suave); }
.corpo-serie { padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 10px; }
.meta { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.meta .reps { font-size: 20px; font-weight: 700; }
.meta .resto { color: var(--suave); }
.registro { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
.registro .sug, .etapa .sug { font-size: 12px; color: var(--suave); align-self: center; max-width: 220px; }
.check { width: 48px; height: 48px; border-radius: var(--raio); border: 2px solid var(--bordaCampo); background: var(--campo); display: grid; place-items: center; color: var(--texto); }
.check.on { background: var(--texto); border-color: var(--texto); color: var(--fundo); }
.feita { display: flex; align-items: center; gap: 10px; }
.feita .valor { font-size: 18px; font-weight: 700; }
.linha-suave { font-size: 13px; color: var(--suave); }
.etapas { display: flex; flex-direction: column; border: 1px solid var(--borda); border-radius: var(--raio); background: var(--sup2); overflow: hidden; }
.serie.m-tingido .etapas { background: var(--sup); }
.etapa { display: flex; align-items: center; gap: 10px; padding: 10px 12px; flex-wrap: wrap; }
.etapa + .etapa, .pausa + .etapa { border-top: 1px solid var(--divisor); }
.etapa .nome-etapa { min-width: 92px; display: flex; flex-direction: column; }
.etapa .nome-etapa b { font-size: 14px; }
.etapa .acao-etapa { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.etapa.atual { background: var(--sup); box-shadow: inset 3px 0 0 var(--texto); }
.pausa { display: flex; align-items: center; gap: 8px; padding: 4px 12px; font-size: 12px; color: var(--suave); border-top: 1px dashed var(--bordaCampo); }
.rodape-serie { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
.lista-series { display: flex; flex-direction: column; gap: 12px; }
.navega { display: flex; flex-direction: column; gap: 8px; }
.navega .dois { display: flex; gap: 8px; } .navega .dois .btn { flex: 1; }

/* ====== dieta ====== */
.item-dieta { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--divisor); }
.item-dieta:first-child { border-top: 0; }
.item-dieta .nome { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item-dieta .nome b { font-size: 15px; }
.qtd { display: inline-flex; align-items: baseline; gap: 4px; padding: 6px 12px; border-radius: 10px; border: 1px solid var(--c); background: var(--ct); color: var(--c); font-weight: 700; white-space: nowrap; flex-shrink: 0; }
.qtd .v { font-size: 18px; } .qtd .u { font-size: 14px; }
.qtd.neutra { --c: var(--texto); --ct: var(--sup3); border-color: var(--bordaCampo); }
.refeicao.m-barra { border-left: 6px solid var(--c); }
.total-dia { display: flex; gap: 8px; flex-wrap: wrap; }
.total-dia div { flex: 1; min-width: 80px; border: 1px solid var(--borda); border-radius: var(--raio); padding: 8px 12px; background: var(--sup); }
.total-dia small { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--suave); }
.total-dia b { font-size: 17px; }
.disp.l390 .total-dia div { flex-basis: 40%; }
.disp.receita { min-height: 980px; }
.escolha { border-left: 3px solid var(--bordaCampo); background: var(--sup3); border-radius: var(--raio); padding: 8px 12px; }

/* ====== histórico ====== */
.letra { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; font-size: 15px; border: 2px solid var(--c); color: var(--c); background: var(--ct); flex-shrink: 0; }
.letra.neutra { --c: var(--texto); --ct: var(--sup); border-color: var(--bordaCampo); }
.divisao { border: 2px solid var(--borda); border-radius: var(--raio); overflow: hidden; background: var(--sup); }
.divisao.com-cor { border-left: 6px solid var(--c); }
.cab-divisao { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--sup3); border-bottom: 3px solid var(--bordaCampo); }
.divisao.com-cor .cab-divisao { background: var(--ct); border-bottom-color: var(--c); }
.cab-divisao .tx { flex: 1; display: flex; flex-direction: column; gap: 1px; }
.cab-divisao .tx b { font-size: 16px; }
.exercicio-hist { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 6px; }
.exercicio-hist + .exercicio-hist { border-top: 1px solid var(--divisor); }
table.cargas { width: 100%; border-collapse: collapse; font-size: 13px; }
table.cargas th { text-align: left; font-size: 12px; color: var(--suave); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--bordaCampo); }
table.cargas td { padding: 6px; border-bottom: 1px solid var(--divisor); }
table.cargas .d { text-align: right; }
.semana { display: flex; flex-direction: column; gap: 10px; }
.cab-semana { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 0 2px; border-bottom: 2px solid var(--bordaCampo); }
.cab-semana b { font-size: 15px; flex: 1; min-width: 160px; }
.pontos { display: flex; gap: 4px; }
.pontos span { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; font-size: 11px; font-weight: 700; border: 1px solid var(--borda); color: var(--suave); background: var(--sup); }
.pontos span.t { border: 2px solid var(--c); color: var(--c); background: var(--ct); }
.pontos span.t.neutra { --c: var(--texto); --ct: var(--sup3); }
.dia { display: flex; gap: 12px; align-items: stretch; }
.data-dia { width: 56px; flex-shrink: 0; border: 1px solid var(--borda); border-radius: var(--raio); background: var(--sup); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 0; }
.data-dia small { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--suave); }
.data-dia b { font-size: 20px; }
.data-dia span { font-size: 11px; color: var(--suave); }
.dia .divisao { flex: 1; min-width: 0; }
.ex-dia { padding: 8px 14px; display: flex; flex-direction: column; gap: 2px; }
.ex-dia + .ex-dia { border-top: 1px solid var(--divisor); }
.ex-dia b { font-size: 14px; }
.periodo-topo { display: flex; flex-direction: column; gap: 8px; }

/* ====== usar receita ====== */
.fundo-editor { flex: 1; display: flex; min-height: 0; position: relative; }
.menu-lat { width: 232px; background: var(--sup); border-right: 1px solid var(--borda); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.menu-lat .falso { height: 34px; border-radius: 10px; background: var(--sup3); }
.menu-lat .falso.ativo { background: var(--marca); }
.area-editor { flex: 1; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.falso-bloco { border: 2px solid var(--borda); border-radius: var(--raio); background: var(--sup); height: 110px; }
.veu { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
.folha { position: absolute; top: 0; right: 0; bottom: 0; width: 600px; background: var(--sup); border-left: 2px solid var(--borda); display: flex; flex-direction: column; }
.disp.l390 .folha { left: 0; width: auto; top: 60px; border-left: 0; border-top: 2px solid var(--borda); border-radius: 18px 18px 0 0; }
.cab-folha { background: var(--sup3); border-bottom: 3px solid var(--bordaCampo); padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
.cab-folha b { flex: 1; font-size: 17px; }
.corpo-folha { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; flex: 1; min-height: 0; }
.corpo-folha > * { flex-shrink: 0; }
.secao-rec { border: 2px solid var(--borda); border-radius: var(--raio); overflow: hidden; background: var(--sup); }
.cab-secao { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--sup3); border: 0; border-bottom: 3px solid var(--bordaCampo); text-align: left; min-height: 48px; }
.cab-secao b { flex: 1; font-size: 15px; }
.secao-rec.fechada .cab-secao { border-bottom: 0; }
.receita { padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.receita + .receita { border-top: 1px solid var(--divisor); }
.receita .linha1 { display: flex; align-items: center; gap: 10px; }
.receita .linha1 b { flex: 1; font-size: 15px; }
.seq { display: flex; flex-wrap: wrap; gap: 6px; }
.peca { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; border: 1px solid var(--borda); border-left: 4px solid var(--c); border-radius: 6px; padding: 3px 8px; background: var(--sup); color: var(--texto); }
.peca .t { color: var(--c); font-weight: 700; }
.peca.sem-cor { border-left-color: var(--bordaCampo); } .peca.sem-cor .t { color: var(--texto); }
.aviso-folha { font-size: 13px; color: var(--suave); border: 1px solid var(--borda); border-radius: var(--raio); padding: 8px 12px; background: var(--sup2); }
</style>
</head>
<body>
<div class="barra-prot" id="barra"></div>
<div class="doc">
  <section class="caixa-doc" id="decidir"></section>
  <section class="caixa-doc">
    <div class="rotulo-palco" id="rotulo-palco"></div>
    <div class="palco"><div id="disp"></div></div>
  </section>
  <section class="caixa-doc" id="contraste"></section>
</div>
<script>
'use strict';
/* ====================== temas (os de app/src/tema/tokens.ts) ====================== */
const TEMAS = {
  claro:  { fundo:'#F7F7F8', sup:'#FFFFFF', sup2:'#F4F4F5', sup3:'#E7E7EA', ff:'#DCDCE1', divisor:'#D4D4D8', borda:'#B9B9C0', campo:'#FFFFFF', bordaCampo:'#80808A', texto:'#111114', suave:'#52525B', sucesso:'#176E3C', atencao:'#875710', perigo:'#B71C1C', neutro:'#616169' },
  areia:  { fundo:'#FAF9F6', sup:'#FFFFFF', sup2:'#F7F5F0', sup3:'#E7E3DB', ff:'#DDD6CA', divisor:'#DDD8CF', borda:'#B9B3A9', campo:'#FFFFFF', bordaCampo:'#77736B', texto:'#111114', suave:'#52525B', sucesso:'#176E3C', atencao:'#875710', perigo:'#B71C1C', neutro:'#616169' },
  escuro: { fundo:'#0A0A0C', sup:'#18181B', sup2:'#222226', sup3:'#2C2C31', ff:'#34343B', divisor:'#36363C', borda:'#4C4C55', campo:'#0F0F12', bordaCampo:'#76767E', texto:'#F4F4F5', suave:'#A1A1AA', sucesso:'#2BB36A', atencao:'#D9962C', perigo:'#F0666B', neutro:'#9A9AA3' },
};
const NOMES_TEMA = { claro: 'Claro', areia: 'Claro areia', escuro: 'Escuro' };
/** Marca fictícia (a mesma dos outros protótipos). */
const MARCA = '#B71C1C';

/*
 * Paleta de IDENTIFICAÇÃO proposta (cor de tipo de série, de divisão e de refeição). Parte da paleta das agendas
 * (PALETA_DA_AGENDA), ajustada até passar 4,5:1 como texto nos três temas, inclusive sobre superficie3 da areia e sobre o
 * fundo tingido do selo. Fora: ARDOSIA (ΔE ~10 do cinza "encerrado"), TERRA e OLIVA (lembram âmbar e verde).
 * O claro e o areia usam a mesma cor; o escuro, a variante clara.
 */
const PALETA = {
  CIANO:   { nome: 'Ciano',   claro: '#00698A', escuro: '#3CC3D6' },
  AZUL:    { nome: 'Azul',    claro: '#1A5CBA', escuro: '#62A0F8' },
  INDIGO:  { nome: 'Índigo',  claro: '#4B3FBF', escuro: '#A196F5' },
  VIOLETA: { nome: 'Violeta', claro: '#8A2DB0', escuro: '#CF8DEE' },
  MAGENTA: { nome: 'Magenta', claro: '#A3237F', escuro: '#F07AC8' },
};
const COR_DO_PAPEL = { AQUECIMENTO: 'CIANO', PREPARACAO: 'AZUL', TRABALHO: 'INDIGO', POS_TRABALHO: 'MAGENTA', OUTRO: null };

function luminancia(hex) {
  const n = parseInt(hex.slice(1), 16);
  const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => { const s = v / 255; return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4; });
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
function contraste(a, b) { const [x, y] = [luminancia(a), luminancia(b)].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); }
function misturar(cor, alvo, t) {
  const a = parseInt(cor.slice(1), 16), b = parseInt(alvo.slice(1), 16);
  const canal = (d) => Math.round(((a >> d) & 255) * (1 - t) + ((b >> d) & 255) * t);
  return '#' + [16, 8, 0].map((d) => canal(d).toString(16).padStart(2, '0').toUpperCase()).join('');
}
/** O `tingido` do app: a cor com alfa 0x18 sobre a superfície, opaco. */
const tingido = (cor, base) => misturar(base, cor, 0x18 / 255);
function lab(hex) {
  const n = parseInt(hex.slice(1), 16);
  const [r, g, b] = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((c) => { const s = c / 255; return s <= 0.04045 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4; });
  const x = (0.4124 * r + 0.3576 * g + 0.1805 * b) / 0.95047, y = 0.2126 * r + 0.7152 * g + 0.0722 * b, z = (0.0193 * r + 0.1192 * g + 0.9505 * b) / 1.08883;
  const f = (t) => (t > 216 / 24389 ? Math.cbrt(t) : ((24389 / 27) * t + 16) / 116);
  return [116 * f(y) - 16, 500 * (f(x) - f(y)), 200 * (f(y) - f(z))];
}
const distancia = (a, b) => Math.hypot(...lab(a).map((v, i) => v - lab(b)[i]));
function marcaParaTexto(marca, fundo) {
  const alvo = luminancia(fundo) < 0.18 ? '#FFFFFF' : '#000000';
  for (let t = 0; t <= 1.0001; t += 0.04) { const c = misturar(marca, alvo, Math.min(t, 1)); if (contraste(c, fundo) >= 4.5) return c; }
  return alvo;
}

/** Cluster como UM bloco: a série tem as etapas dentro, com a pausa entre elas, e o "Concluir série" no rodapé. */
function corpoCluster(s) {
  const total = s.blocos.reduce((a, b) => a + b, 0);
  const feitas = s.blocos.reduce((a, b, i) => a + (estado.etapas[i + 1] ? b : 0), 0);
  const atual = s.blocos.findIndex((_, i) => !estado.etapas[i + 1]) + 1;
  const linhas = s.blocos.map((b, i) => {
    const n = i + 1, ok = !!estado.etapas[n];
    const pausa = i > 0 ? `<div class="pausa">${ic('pausa', 14)} Pausa de ${s.pausa} s entre os blocos</div>` : '';
    const acao = ok
      ? `<span class="forte num">60 kg × ${b}</span><button class="check on" data-acao="etapa" data-n="${n}" aria-label="Desfazer bloco ${n}">${ic('check', 20)}</button>`
      : `<input class="campo num" style="width:80px;height:44px" placeholder="kg" aria-label="Carga do bloco ${n}"><input class="campo num" style="width:60px;height:44px" aria-label="Reps do bloco ${n}"><button class="check" data-acao="etapa" data-n="${n}" aria-label="Marcar bloco ${n}">${ic('check', 20)}</button>${n === atual ? '<span class="sug" style="flex-basis:100%;text-align:right">Sugestão: 60 kg (a carga dos blocos anteriores)</span>' : ''}`;
    return `${pausa}<div class="etapa${n === atual ? ' atual' : ''}"><div class="nome-etapa"><b>Bloco ${n}</b><span class="pequeno num">${b} reps${ok ? ' · feito' : n === atual ? ' · agora' : ''}</span></div><div class="acao-etapa">${acao}</div></div>`;
  }).join('');
  const falta = s.blocos.length - Object.values(estado.etapas).filter(Boolean).length;
  return `<div class="corpo-serie">
    <div class="meta"><span class="reps num">${total} reps em ${s.blocos.length} blocos</span><span class="resto num">${s.blocos.join(' + ')} · ${esc(s.resto)}</span></div>
    <div class="linha-suave num">Último registro: ${esc(s.ultimo)}</div>
    <div class="etapas" role="group" aria-label="Blocos do Cluster">${linhas}</div>
    <div class="rodape-serie"><span class="forte num">Feito até agora: ${feitas} de ${total} reps</span><button class="btn" ${falta ? `disabled title="Falta ${falta === 1 ? 'o bloco ' + atual : falta + ' blocos'}"` : ''} data-acao="nada">Concluir série</button></div>
    ${falta ? `<span class="pequeno">Falta ${falta === 1 ? `o bloco ${atual}` : `${falta} blocos`} para concluir.</span>` : ''}</div>`;
}

function porDia() {
  // Agrupa por semana (segunda a domingo); dentro, um cartão por dia treinado, a divisão no cabeçalho.
  const semanas = new Map();
  for (const dia of DIAS) {
    const d = dataDe(dia[0]); const seg = new Date(d); seg.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7));
    const chave = seg.toISOString().slice(0, 10);
    if (!semanas.has(chave)) semanas.set(chave, []);
    semanas.get(chave).push(dia);
  }
  return [...semanas].map(([ini, dias]) => {
    const seg = dataDe(ini), dom = new Date(seg); dom.setUTCDate(seg.getUTCDate() + 6);
    const treinados = new Map(dias.map((x) => [(dataDe(x[0]).getUTCDay() + 6) % 7, x[1]]));
    const pontos = ['S', 'T', 'Q', 'Q', 'S', 'S', 'D'].map((l, i) => {
      if (!treinados.has(i)) return `<span title="Sem treino">${l}</span>`;

      return `<span class="t${k ? '' : ' neutra'}" ${k ? `style="${vars(k)}"` : ''} title="Treino ${treinados.get(i)}">${treinados.get(i)}</span>`;
    }).join('');
    const cartoes = dias.map(([iso, l, exs]) => {

      return `<div class="dia"><div class="data-dia num"><small>${SEMANA[d.getUTCDay()]}</small><b>${String(d.getUTCDate()).padStart(2, '0')}</b><span>${['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'][d.getUTCMonth()]}</span></div>
        <section class="divisao${k ? ' com-cor' : ''}" style="${vars(k)}"><div class="cab-divisao">${html}<div class="tx"><b>Treino ${l} · ${esc(div.nome)}</b><span class="pequeno">${exs.length} ${exs.length === 1 ? 'exercício' : 'exercícios'}</span></div></div>

    }).join('');
    return `<div class="semana"><div class="cab-semana num"><b>Semana de ${ddmm(seg)} a ${ddmm(dom)}</b><span class="pequeno">${dias.length} ${dias.length === 1 ? 'treino' : 'treinos'}</span><div class="pontos" aria-label="Dias da semana com treino">${pontos}</div></div>${cartoes}</div>`;
  }).join('');
}

/* ====================== contraste ao vivo ====================== */
function verificar(nomeTema) {
  const t = TEMAS[nomeTema], var_ = nomeTema === 'escuro' ? 'escuro' : 'claro';
  return Object.entries(PALETA).map(([chave, p]) => {
    const c = p[var_], tint = tingido(c, t.sup);
    const texto = Math.min(...[t.sup, t.sup2, t.sup3, tint].map((s) => contraste(c, s)));
    const barra = Math.min(...[t.fundo, t.sup, t.sup2, t.sup3, t.ff].map((s) => contraste(c, s)));
    const suaveNoTingido = contraste(t.suave, tint);
    const dStatus = Math.min(...[t.sucesso, t.atencao, t.perigo].map((s) => distancia(c, s)));
    const dCinza = distancia(c, t.neutro);
    const dOutras = Math.min(...Object.entries(PALETA).filter(([k]) => k !== chave).map(([, q]) => distancia(c, q[var_])));
    const ok = texto >= 4.5 && barra >= 3 && suaveNoTingido >= 4.5 && dStatus >= 25 && dCinza >= 20 && dOutras >= 15;
    return { chave, nome: p.nome, c, texto, barra, suaveNoTingido, dStatus, dCinza, dOutras, ok };
  });
}
function tabelaContraste() {
  const usos = { CIANO: 'Aquecimento · divisão C', AZUL: 'FS · divisão A', INDIGO: 'WS (e Top set "por papel") · divisão E', VIOLETA: 'Top set ("por tipo") · divisão D', MAGENTA: 'Back off · divisão B' };
  const f = (v) => v.toFixed(2).replace('.', ','), cl = (ok) => (ok ? 'ok' : 'falha');
  const tabs = ['claro', 'areia', 'escuro'].map((nt) => {
    const linhas = verificar(nt);
    const min = (k) => Math.min(...linhas.map((l) => l[k]));
    return `<div class="t${nt === aj.tema ? ' atual' : ''}"><h4>${NOMES_TEMA[nt]}${nt === aj.tema ? ' (em uso na prévia)' : ''}</h4><table class="cont num"><thead><tr><th>Cor</th><th>Texto/ícone<br>≥ 4,5</th><th>Barra/borda<br>≥ 3</th><th>Texto suave<br>no tingido ≥ 4,5</th><th>ΔE status<br>≥ 25</th><th>ΔE cinza<br>≥ 20</th><th>ΔE outra<br>≥ 15</th><th></th></tr></thead><tbody>
      ${linhas.map((l) => `<tr><td title="${esc(usos[l.chave])}"><span class="amostra" style="background:${l.c}"></span>${l.nome} <small>${l.c}</small></td><td class="${cl(l.texto >= 4.5)}">${f(l.texto)}</td><td class="${cl(l.barra >= 3)}">${f(l.barra)}</td><td class="${cl(l.suaveNoTingido >= 4.5)}">${f(l.suaveNoTingido)}</td><td class="${cl(l.dStatus >= 25)}">${l.dStatus.toFixed(0)}</td><td class="${cl(l.dCinza >= 20)}">${l.dCinza.toFixed(0)}</td><td class="${cl(l.dOutras >= 15)}">${l.dOutras.toFixed(0)}</td><td class="${cl(l.ok)}">${l.ok ? 'passa' : 'NÃO passa'}</td></tr>`).join('')}
      <tr><td><b>Mínimo</b></td><td class="${cl(min('texto') >= 4.5)}">${f(min('texto'))}</td><td class="${cl(min('barra') >= 3)}">${f(min('barra'))}</td><td class="${cl(min('suaveNoTingido') >= 4.5)}">${f(min('suaveNoTingido'))}</td><td class="${cl(min('dStatus') >= 25)}">${min('dStatus').toFixed(0)}</td><td class="${cl(min('dCinza') >= 20)}">${min('dCinza').toFixed(0)}</td><td class="${cl(min('dOutras') >= 15)}">${min('dOutras').toFixed(0)}</td><td></td></tr></tbody></table></div>`;
  }).join('');
  const todas = ['claro', 'areia', 'escuro'].every((nt) => verificar(nt).every((l) => l.ok));
  const fora = ['ARDOSIA', 'TERRA', 'OLIVA'].map((k) => { const c = { ARDOSIA: '#51677E', TERRA: '#A64F43', OLIVA: '#758418' }[k]; return `${k}: ΔE ${distancia(c, TEMAS.claro.neutro).toFixed(0)} do cinza, ${Math.min(...['sucesso', 'atencao', 'perigo'].map((s) => distancia(c, TEMAS.claro[s]))).toFixed(0)} do status mais perto`; }).join(' · ');
  return `<h2>Contraste (calculado ao vivo nesta página)</h2>
    <p>Fórmulas iguais às de <code>app/src/tema/tokens.ts</code> (<code>contraste</code>, <code>tingido</code>) e de <code>tokens.test.ts</code> (ΔE CIE76 da paleta das agendas). <b>Texto/ícone</b> = a cor sobre <code>superficie</code>, <code>superficie2</code>, <code>superficie3</code> e sobre o próprio fundo tingido do selo (o pior dos quatro). <b>Barra/borda</b> = sobre <code>fundo</code>, as três superfícies e <code>faixaForte</code>. <b>Texto suave no tingido</b> = <code>textoSuave</code> sobre o fundo tingido (vale para a opção "Fundo tingido"). <b>ΔE status</b> = distância do verde, âmbar e vermelho do tema (D6); <b>ΔE cinza</b> = do cinza "encerrado" (<code>neutro</code>).</p>
    <div class="tabelas-cont">${tabs}</div>
    <p class="resumo-cont">${todas ? 'As cinco cores passam em todas as regras nos três temas.' : 'Alguma cor não passa: ver as células em vermelho.'}</p>
    <p><small>Ficaram de fora da paleta das agendas (claro): ${fora}. A ardósia se confunde com o cinza de "encerrado/inativo"; terra e oliva lembram o âmbar e o verde de status.</small></p>`;
}

  <li class="decisao"><b>6. Dieta.</b><span class="op">Quantidade e unidade numa etiqueta grande à direita, com a cor da refeição e uma barra na refeição<span class="rec">proposta</span> × etiqueta em negrito sem cor.</span></li>
  <li class="decisao"><b>7. Histórico (C45).</b><span class="op">Cada cartão diz o período na faixa ("Pasta atual: 01/10 a 31/10", "Últimos 12 meses · todas as pastas", "Desde o primeiro registro"); "Registros e cargas" ganha a escolha de período (pasta atual, anterior, últimos 30 dias) e uma frase do que está mostrando. "Por dia" passa a ser semana → dia: cabeçalho da semana com os 7 dias marcados, um cartão por dia treinado com a data à esquerda e a divisão no cabeçalho<span class="rec">proposta</span>.</span></li>
  <li class="decisao"><b>8. "Usar receita" (C16).</b><span class="op">Busca no topo; seções recolhíveis: receitas completas primeiro, depois Aquecimento, Preparação, Trabalho, Pós-trabalho e uma seção por técnica (Cluster, Rest pause, Drop-set); cada receita aparece uma vez e mostra a sequência com a cor de cada tipo<span class="rec">proposta</span> × agrupar por coleção (como hoje), com a mesma sequência colorida.</span></li>
  </ol>`;
}

/* ====================== render ====================== */
function barra() {
  const g = (k, t, ops) => `<div class="grupo-prot"><span>${t}</span>${ops.map(([v, n]) => `<button class="${aj[k] === v ? 'sel' : ''}" data-aj="${k}" data-v="${v}">${n}</button>`).join('')}</div>`;
  return `<b class="tit">Protótipo · Frente G</b>
    ${g('tela', 'Tela', [['execucao', 'Execução (C35)'], ['dieta', 'Dieta (C50)'], ['historico', 'Histórico (C45/C74)'], ['receita', 'Usar receita (C16)']])}
    ${g('largura', 'Largura', [['390', '390'], ['1280', '1280']])}
    ${g('tema', 'Tema', [['claro', 'Claro'], ['areia', 'Claro areia'], ['escuro', 'Escuro']])}
    ${g('corPor', 'Cor', [['tipo', 'Por tipo'], ['papel', 'Por papel']])}
    ${g('marcacao', 'Na série', [['barra', 'Barra lateral'], ['tingido', 'Fundo tingido'], ['faixa', 'Faixa no topo']])}
    ${g('divisoes', 'Divisões', [['cor', 'Com cor'], ['letra', 'Só a letra']])}
    ${g('dieta', 'Dieta', [['refeicao', 'Cor da refeição'], ['neutro', 'Sem cor']])}`;
}
function render() {
  const foco = document.activeElement && document.activeElement.id, pos = foco ? document.activeElement.selectionStart : null;
  document.getElementById('barra').innerHTML = barra();
  document.getElementById('decidir').innerHTML = decidir();
  const t = tema(), d = document.getElementById('disp');
  d.className = `disp l${aj.largura}${aj.tela === 'receita' ? ' receita' : ''}`;
  for (const [k, v] of Object.entries(t)) d.style.setProperty('--' + k, v);
  d.style.setProperty('--marca', MARCA);
  d.style.setProperty('--marcaTexto', marcaParaTexto(MARCA, t.sup));
  d.style.colorScheme = escuro() ? 'dark' : 'light';
  const telas = { execucao: telaExecucao, dieta: telaDieta, historico: telaHistorico, receita: telaReceita };
  d.innerHTML = (aj.largura === '390' ? barraSistema() : '') + telas[aj.tela]();
  document.getElementById('rotulo-palco').textContent = `Prévia: ${{ execucao: 'execução do aluno', dieta: 'dieta do aluno', historico: 'histórico do aluno', receita: 'janela "Usar receita" no editor de treino' }[aj.tela]} · ${aj.largura} px · tema ${NOMES_TEMA[aj.tema].toLowerCase()}`;
  document.getElementById('contraste').innerHTML = tabelaContraste();
  if (foco) { const el = document.getElementById(foco); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) { /* ignora */ } } }
}
document.addEventListener('click', (ev) => {
  const a = ev.target.closest('[data-aj]');
  if (a) { aj[a.dataset.aj] = a.dataset.v; guardar(); render(); return; }
  const el = ev.target.closest('[data-acao]'); if (!el) return;
  const d = el.dataset;
  if (d.acao === 'serie') { estado.feitas.has(d.id) ? estado.feitas.delete(d.id) : estado.feitas.add(d.id); }
  else if (d.acao === 'etapa') { estado.etapas[d.n] = !estado.etapas[d.n]; }
  else if (d.acao === 'opcao') { estado.opcao[d.r] = Number(d.o); }
  else if (d.acao === 'secao') { estado.fechadas.has(d.g) ? estado.fechadas.delete(d.g) : estado.fechadas.add(d.g); }
  else return;
  render();
});
document.addEventListener('input', (ev) => { if (ev.target.id === 'busca-rec') { estado.busca = ev.target.value; render(); } });
render();
</script>

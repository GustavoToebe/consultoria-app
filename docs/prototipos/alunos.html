<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo · Alunos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Protótipo das telas de aluno (lista, ficha e novo aluno), 30/10/2026. Dados fictícios. Nada aqui fala com a API. */
:root { --fonte: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; --raio: 12px; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--fonte); background: var(--fundo); color: var(--texto); font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--texto); outline-offset: 2px; }
@media (prefers-reduced-motion: no-preference) { .anima { transition: background-color .12s, border-color .12s, transform .08s; } .anima:active:not(:disabled) { transform: scale(.97); } }

#app { display: flex; min-height: 100vh; }
body.simula-cel #app { max-width: 390px; margin: 16px auto; min-height: calc(100vh - 32px); border: 1px solid var(--borda); border-radius: 20px; overflow: hidden; }
@media (min-width: 900px) { body.com-ajustes #app { margin-right: 340px; } body.com-ajustes.simula-cel #app { margin-right: auto; transform: translateX(-170px); } }
.principal { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* menu lateral */
.menu { width: 240px; flex-shrink: 0; background: var(--sup); border-right: 1px solid var(--borda); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.menu .logo { height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--borda); }
.menu .logo .q { width: 32px; height: 32px; border-radius: 8px; background: var(--marca); color: #fff; display: grid; place-items: center; }
.menu .logo b { display: block; font-size: 15px; } .menu .logo small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); }
.menu nav { padding: 8px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.menu .grupo { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); padding: 12px 10px 4px; }
.item-menu { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: var(--raio); color: var(--suave); border: 0; background: none; width: 100%; text-align: left; }
.item-menu:hover { background: var(--sup3); color: var(--texto); }
.item-menu.ativo { background: var(--marca); color: #fff; font-weight: 600; }
.topo { height: 60px; display: flex; align-items: center; gap: 16px; padding: 0 24px; background: var(--sup); border-bottom: 1px solid var(--borda); }
.busca { flex: 1; max-width: 520px; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 1px solid var(--bordaCampo); border-radius: var(--raio); background: var(--campo); color: var(--suave); }
.busca kbd { margin-left: auto; font-size: 11px; border: 1px solid var(--borda); border-radius: 4px; padding: 1px 6px; }
.topo .dir { margin-left: auto; display: flex; align-items: center; gap: 16px; }
.usuario { display: flex; align-items: center; gap: 10px; border: 1px solid var(--borda); border-radius: var(--raio); padding: 6px 12px; }
.usuario b { display: block; font-size: 13px; } .usuario small { color: var(--suave); font-size: 12px; }
.inferior { display: none; }
body.cel .menu, body.cel .topo { display: none; }
body.cel .inferior { display: flex; position: sticky; bottom: 0; background: var(--sup); border-top: 1px solid var(--borda); z-index: 10; }
.inferior button { flex: 1; border: 0; background: none; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--suave); }
.inferior button.ativo { color: var(--marcaTexto); font-weight: 700; }

.conteudo { width: 100%; max-width: var(--largura, 1240px); margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 24px; }
body.cel .conteudo { padding: 16px 12px; gap: 16px; }
.trilha { display: flex; align-items: center; gap: 6px; color: var(--suave); font-size: 13px; flex-wrap: wrap; }
.trilha button { background: none; border: 0; padding: 0; color: var(--suave); text-decoration: underline; }
.trilha b { color: var(--texto); }
.cab-tela { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.cab-tela .tx { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 6px; }
.cab-tela .acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
h1 { font-size: 24px; line-height: 30px; margin: 0; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.suave { color: var(--suave); }
.pequeno { font-size: 12px; color: var(--suave); }

/* botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 14px; border-radius: var(--raio); border: 1px solid var(--borda); background: var(--sup); font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--sup3); }
.btn.primario { background: var(--marca); border-color: var(--marca); color: #fff; }
.btn.primario:hover { filter: brightness(.92); }
.btn.fantasma { border-color: transparent; background: transparent; }
.btn.fantasma:hover { background: var(--sup3); }
.btn.perigo { color: var(--perigo); }
.btn:disabled { opacity: .45; cursor: default; }
.ib { width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: var(--raio); border: 1px solid var(--borda); background: var(--sup); color: var(--texto); }
.ib:hover:not(:disabled) { background: var(--sup3); }
body.cel .btn { min-height: 44px; } body.cel .ib { width: 44px; height: 44px; }

/* selos */
.selo { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid var(--c); color: var(--c); background: color-mix(in srgb, var(--c) 9%, var(--sup)); }
.selo.sucesso { --c: var(--sucesso); } .selo.atencao { --c: var(--atencao); } .selo.perigo { --c: var(--perigo); } .selo.neutro { --c: var(--suave); }
.etiqueta { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border: 1px solid var(--borda); border-radius: 6px; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--suave); background: var(--sup); }

/* blocos */
.bloco { background: var(--sup); border: var(--bwBloco) solid var(--borda); border-radius: var(--raio); overflow: hidden; }
.faixa { background: var(--sup3); border-bottom: 3px solid var(--bordaCampo); padding: 14px 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.faixa .tit { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 2px; }
.faixa .tit b { font-size: 17px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.faixa .tit small { color: var(--suave); font-size: 13px; }
.faixa .acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
.corpo { padding: 20px; display: flex; flex-direction: column; gap: 16px; }
body.cel .corpo { padding: 16px; } body.cel .faixa { padding: 12px 16px; }
.rotulo { font-size: 13px; font-weight: 600; margin-bottom: 6px; display: block; }
.secao-titulo { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); }
.linha { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.linha > .cresce { flex: 1; min-width: 200px; }
.campo { height: 42px; width: 100%; border: 1px solid var(--bordaCampo); background: var(--campo); border-radius: var(--raio); padding: 0 12px; color: var(--texto); }
textarea.campo { height: 84px; padding: 10px 12px; resize: vertical; }
.campo.erro { border: 2px solid var(--perigo); }
.msg-erro { color: var(--perigo); font-size: 12px; margin-top: 4px; display: block; }
.ajuda { color: var(--suave); font-size: 12px; margin-top: 4px; display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 40px; padding: 0 14px; border-radius: var(--raio); border: 1px solid var(--borda); background: var(--sup); font-weight: 600; font-size: 13px; }
.chip:hover { background: var(--sup3); } .chip.sel { background: var(--texto); color: var(--fundo); border-color: var(--texto); }
.divisor { height: 1px; background: var(--divisor); border: 0; margin: 0; }
.grade-form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grade-form .inteiro { grid-column: 1 / -1; }
body.cel .grade-form { grid-template-columns: 1fr; }

/* lista estilo tabela (a foto de referência) */
.filtros { display: grid; grid-template-columns: minmax(220px, 1.3fr) auto auto; gap: 16px; align-items: end; }
body.cel .filtros { grid-template-columns: 1fr; }
.cab-colunas, .linha-aluno { display: grid; grid-template-columns: 40px minmax(220px, 2.2fr) 1.6fr 1.5fr 1.1fr 1.1fr 92px; gap: 12px; align-items: center; }
.cab-colunas { padding: 0 16px 10px; border-bottom: 1px solid var(--divisor); font-size: 13px; font-weight: 600; color: var(--suave); }
.lista { display: flex; flex-direction: column; gap: 10px; }
.linha-aluno { padding: 12px 16px; border: 1px solid var(--borda); border-radius: var(--raio); background: var(--sup2); cursor: pointer; min-height: 64px; }
.linha-aluno:hover { background: var(--sup3); border-color: var(--bordaCampo); }
.linha-aluno.marcada { border-color: var(--texto); box-shadow: inset 0 0 0 1px var(--texto); }
body.sem-caixa .cab-colunas, body.sem-caixa .linha-aluno { grid-template-columns: minmax(220px, 2.2fr) 1.6fr 1.5fr 1.1fr 1.1fr 92px; }
.nome-aluno { display: flex; align-items: center; gap: 12px; min-width: 0; }
.nome-aluno b { font-size: 15px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nome-aluno small { color: var(--suave); font-size: 12px; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--sup3); border: 1px solid var(--borda); flex-shrink: 0; }
.avatar.grande { width: 56px; height: 56px; font-size: 18px; }
.cel-lista .linha-aluno { grid-template-columns: 1fr; gap: 8px; }
.meta-cel { display: none; }
body.cel .cab-colunas { display: none; }
body.cel .linha-aluno { grid-template-columns: auto 1fr; }
body.cel .linha-aluno .col { display: none; }
body.cel .linha-aluno .meta-cel { display: flex; grid-column: 1 / -1; flex-direction: column; gap: 6px; }
.caixa { width: 22px; height: 22px; border: 2px solid var(--bordaCampo); border-radius: 6px; display: grid; place-items: center; background: var(--campo); }
.caixa.on { background: var(--texto); border-color: var(--texto); color: var(--fundo); }
.acoes-linha { display: flex; gap: 6px; justify-content: flex-end; }
.barra-lote { position: sticky; bottom: 0; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; background: var(--sup); border: var(--bwBloco) solid var(--texto); border-radius: var(--raio); }
.paginas { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* ficha */
.atalhos { position: sticky; top: 0; z-index: 6; display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 0; background: var(--fundo); border-bottom: 1px solid var(--divisor); }
.atalhos button { border: 1px solid var(--borda); background: var(--sup); border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 13px; }
.atalhos button:hover { background: var(--sup3); }
.proximo { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 16px; border-radius: var(--raio); border: 1px solid var(--c); background: color-mix(in srgb, var(--c) 8%, var(--sup)); }
.proximo.atencao { --c: var(--atencao); } .proximo.perigo { --c: var(--perigo); } .proximo.neutro { --c: var(--borda); }
.proximo .tx { flex: 1; min-width: 220px; } .proximo .tx b { display: block; color: var(--texto); }
.indicadores { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
body.cel .indicadores { grid-template-columns: 1fr 1fr; }
.indicador { border: 1px solid var(--borda); border-radius: var(--raio); padding: 12px 14px; background: var(--sup2); display: flex; flex-direction: column; gap: 4px; }
.indicador small { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--suave); }
.indicador b { font-size: 16px; }
.dados { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
body.cel .dados { grid-template-columns: 1fr; }
.par { display: flex; flex-direction: column; gap: 2px; margin-top: 10px; } .par small { color: var(--suave); font-size: 12px; } .par span { font-weight: 500; }
.tres { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.dois { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
body.cel .tres, body.cel .dois { grid-template-columns: 1fr; gap: 16px; }
.linha-pasta { display: grid; grid-template-columns: minmax(200px, 1.6fr) 1.6fr auto 40px; gap: 12px; align-items: center; padding: 12px 16px; border: 1px solid var(--borda); border-radius: var(--raio); background: var(--sup2); cursor: pointer; }
.linha-pasta:hover { background: var(--sup3); }
body.cel .linha-pasta { grid-template-columns: 1fr auto; }
body.cel .linha-pasta .planos { grid-column: 1 / -1; }
.planos { display: flex; gap: 6px; flex-wrap: wrap; }
.contagem { display: flex; flex-direction: column; gap: 10px; }
.contagem .n { font-size: 28px; font-weight: 700; line-height: 1; }
.barras { display: flex; align-items: flex-end; gap: 6px; height: 64px; }
.barras div { flex: 1; background: var(--texto); border-radius: 4px 4px 0 0; opacity: .85; }
.barras div.vazio { background: var(--divisor); height: 4px !important; }
.dias-barras { display: flex; gap: 6px; font-size: 11px; color: var(--suave); } .dias-barras span { flex: 1; text-align: center; }
table.tab { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
table.tab th { text-align: left; font-weight: 600; color: var(--suave); padding: 8px 10px; border-bottom: 1px solid var(--divisor); }
table.tab td { padding: 10px; border-bottom: 1px solid var(--divisor); }
table.tab td.dif { color: var(--suave); }
.menu-acoes { position: absolute; right: 0; top: 46px; z-index: 30; min-width: 230px; background: var(--sup); border: var(--bwBloco) solid var(--borda); border-radius: var(--raio); padding: 6px; display: flex; flex-direction: column; }
.menu-acoes button { text-align: left; border: 0; background: none; padding: 10px 12px; border-radius: 8px; font-weight: 600; }
.menu-acoes button:hover { background: var(--sup3); }
.menu-acoes .perigo { color: var(--perigo); }
.rodape-form { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; position: sticky; bottom: 0; padding: 12px 0; background: var(--fundo); border-top: 1px solid var(--divisor); }

/* painel de ajustes do protótipo */
.abrir-ajustes { position: fixed; right: 16px; bottom: 16px; z-index: 60; background: #111114; color: #fff; border: 0; border-radius: 999px; height: 48px; padding: 0 18px; font-weight: 700; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
body.cel .abrir-ajustes { bottom: auto; top: 10px; right: 10px; height: 36px; padding: 0 12px; font-size: 12px; }
body.cel .rodape-form { bottom: 57px; }
.ajustes { position: fixed; top: 0; right: 0; bottom: 0; width: 340px; max-width: 100vw; z-index: 70; background: #fff; color: #111114; border-left: 1px solid #B9B9C0; display: flex; flex-direction: column; font-size: 13px; }
.ajustes header { padding: 14px 16px; border-bottom: 1px solid #D4D4D8; display: flex; align-items: center; gap: 8px; background: #F4F4F5; }
.ajustes header b { flex: 1; font-size: 15px; }
.ajustes .lista-aj { overflow-y: auto; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.ajustes .op b { display: block; margin-bottom: 6px; font-size: 12px; } .ajustes .op small { display: block; color: #52525B; margin-top: 4px; }
.ajustes .opcoes { display: flex; gap: 6px; flex-wrap: wrap; }
.ajustes .opcoes button { border: 1px solid #B9B9C0; background: #fff; color: #111114; border-radius: 8px; padding: 6px 10px; font-weight: 600; font-size: 12px; }
.ajustes .opcoes button.sel { background: #111114; color: #fff; border-color: #111114; }
.ajustes footer { border-top: 1px solid #D4D4D8; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.ajustes footer button { border: 1px solid #B9B9C0; background: #fff; color: #111114; border-radius: 8px; min-height: 38px; font-weight: 700; }
.ajustes footer button.forte { background: #111114; color: #fff; }
.ajustes textarea { width: 100%; height: 110px; font-family: ui-monospace, monospace; font-size: 11px; }
.ajustes .fechar { width: 36px; height: 36px; border: 1px solid #B9B9C0; border-radius: 8px; background: #fff; color: #111114; display: grid; place-items: center; }
.ajustes h4 { margin: 8px 0 0; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #52525B; }
body.editando [data-t] { outline: 1px dashed #2563eb; outline-offset: 1px; cursor: text; border-radius: 3px; }
.editor-texto { position: fixed; z-index: 90; background: #fff; color: #111114; border: 1px solid #2563eb; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; width: 320px; max-width: calc(100vw - 16px); box-shadow: 0 6px 24px rgba(0,0,0,.2); }
.editor-texto input { height: 36px; border: 1px solid #8A8A93; border-radius: 6px; padding: 0 10px; }
.editor-texto .lb { display: flex; gap: 6px; } .editor-texto button { border: 1px solid #B9B9C0; background: #fff; border-radius: 6px; padding: 6px 10px; font-weight: 700; } .editor-texto button.forte { background: #111114; color: #fff; }
.aviso-flutuante { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); z-index: 80; background: #111114; color: #fff; border-radius: 10px; padding: 10px 14px; font-size: 13px; max-width: calc(100vw - 32px); }
</style>
</head>
<body>
<div id="app"></div>
<div id="camada-ajustes"></div>
<div id="camada-aviso"></div>
<script>
'use strict';
/* ====================== cores (as de app/src/tema/tokens.ts, com o fundo quase branco) ====================== */
const TEMAS = {
  claro: { fundo:'#F7F7F8', sup:'#FFFFFF', sup2:'#F4F4F5', sup3:'#E7E7EA', divisor:'#D4D4D8', borda:'#B9B9C0', campo:'#FFFFFF', bordaCampo:'#8A8A93', texto:'#111114', suave:'#52525B', sucesso:'#176E3C', atencao:'#875710', perigo:'#B71C1C' },
  areia: { fundo:'#FAF9F6', sup:'#FFFFFF', sup2:'#F7F5F0', sup3:'#E7E3DB', divisor:'#DDD8CF', borda:'#B9B3A9', campo:'#FFFFFF', bordaCampo:'#77736B', texto:'#111114', suave:'#52525B', sucesso:'#176E3C', atencao:'#875710', perigo:'#B71C1C' },
  escuro: { fundo:'#0A0A0C', sup:'#18181B', sup2:'#222226', sup3:'#2C2C31', divisor:'#36363C', borda:'#4C4C55', campo:'#0F0F12', bordaCampo:'#63636B', texto:'#F4F4F5', suave:'#A1A1AA', sucesso:'#2BB36A', atencao:'#D9962C', perigo:'#F0666B' },
};
const PADRAO = { tema:'claro', bordasReforcadas:false, agrupar:'atualizacao', atalhos:true, caixaNaLinha:false, celular:false, editarTextos:false };
let ajustes = { ...PADRAO }, textos = {};
try { const s = JSON.parse(localStorage.getItem('prototipo-alunos') || 'null'); if (s) { ajustes = { ...PADRAO, ...(s.ajustes || {}) }; textos = s.textos || {}; } } catch (e) {}
const guardar = () => { try { localStorage.setItem('prototipo-alunos', JSON.stringify({ ajustes, textos })); } catch (e) {} };

/* ====================== ícones (desenho do lucide, o mesmo do app) ====================== */
const P = {
  casa:'<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .71-1.53l7-6a2 2 0 0 1 2.58 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  alunos:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',

/* ====================== regras (as do app: statusAtualizacaoTreinador, proximoPassoDoAluno, dataRelativa) ====================== */
function statusAtualizacao(a) {
  if (!a) return null;
  if (a.fase === 'ENVIADA') return { tipo: 'atencao', texto: 'Para revisar', icone: 'alerta' };
  if (a.fase === 'REVISADA') return { tipo: 'sucesso', texto: 'Revisada', icone: 'ok' };
  if (a.fase === 'ATRASADA') return { tipo: 'perigo', texto: `Atrasada há ${a.dias} ${a.dias === 1 ? 'dia' : 'dias'}`, icone: 'triangulo' };
  return { tipo: 'neutro', texto: a.dias === 0 ? 'Hoje' : a.dias === 1 ? 'Amanhã' : `Em ${a.dias} dias` };
}
const ultimoTexto = (d) => d === null ? 'Nunca registrou' : d === 0 ? 'Hoje' : d === 1 ? 'Ontem' : `Há ${d} dias`;
function proximoPasso(a) {
  if (!a.ativo) return { tipo: 'neutro', texto: 'Aluno inativo. Para voltar a acompanhar, reative pelo menu ⋯.' };
  if (a.atualizacao?.fase === 'ENVIADA') return { tipo: 'atencao', texto: 'A atualização chegou. Revise as respostas e mande o feedback.', acao: 'Revisar atualização' };
  if (a.atualizacao?.fase === 'ATRASADA') return { tipo: 'perigo', texto: `A atualização está atrasada há ${a.atualizacao.dias} ${a.atualizacao.dias === 1 ? 'dia' : 'dias'}. Vale falar com o aluno.` };
  if (!a.plano) return { tipo: 'atencao', texto: 'Sem pasta ainda. Crie a primeira com o treino e a dieta.', acao: 'Nova pasta' };
  if (!a.temAcesso) return { tipo: 'atencao', texto: 'O aluno ainda não entra no app. Envie o convite em Acesso ao app.', acao: 'Gerar convite' };
  return { tipo: 'neutro', texto: 'Tudo em dia.' };
}

const par = (r, v) => `<div class="par"><small>${r}</small><span>${esc(v || '—')}</span></div>`;
function grafico(v) {
  const w = 520, h = 140, min = Math.min(...v) - 0.5, max = Math.max(...v) + 0.5;
  const pts = v.map((x, i) => [20 + (i * (w - 40)) / (v.length - 1), h - 20 - ((x - min) / (max - min)) * (h - 40)]);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img" aria-label="Peso: de ${v[0]} a ${v[v.length - 1]} kg">
    <polyline fill="none" stroke="var(--texto)" stroke-width="2.5" points="${pts.map((p) => p.join(',')).join(' ')}"/>
    ${pts.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--sup)" stroke="var(--texto)" stroke-width="2"/><text x="${p[0]}" y="${p[1] - 10}" font-size="11" text-anchor="middle" fill="var(--suave)">${String(v[i]).replace('.', ',')}</text>`).join('')}</svg>`;
}

/* ====================== tela 3: novo aluno ====================== */
function validar(f) {
  const e = {};
  if (!f.nome.trim()) e.nome = 'Informe o nome.';
  if (f.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email)) e.email = 'E-mail inválido.';
  if (f.cpf && f.cpf.replace(/\D/g, '').length !== 11) e.cpf = 'CPF inválido.';
  const end = ['cep', 'logradouro', 'numero', 'complemento', 'bairro', 'cidade', 'uf'];
  if (end.some((k) => f[k].trim())) {
    for (const [k, m] of [['cep', 'Informe o CEP.'], ['logradouro', 'Informe a rua.'], ['numero', 'Informe o número (ou s/n).'], ['cidade', 'Informe a cidade.'], ['uf', 'Informe a UF.']]) if (!f[k].trim()) e[k] = m;
  }
  if (f.ciclo && !(Number(f.ciclo) >= 1 && Number(f.ciclo) <= 365)) e.ciclo = 'De 1 a 365 dias.';
  return e;
}

  return `<label class="${o.inteiro ? 'inteiro' : ''}"><span class="rotulo">${T('form.' + k, rotulo)}</span>${o.botao ? `<span style="display:flex;gap:8px">${input}${o.botao}</span>` : input}${err ? `<span class="msg-erro">${esc(err)}</span>` : o.ajuda ? `<span class="ajuda">${esc(o.ajuda)}</span>` : ''}</label>`;
}

/* ====================== painel de ajustes ====================== */
let ajAberto = false, exportado = '';
function op(k, t, ops, dica) { return `<div class="op"><b>${t}</b><div class="opcoes">${ops.map(([v, n]) => `<button class="${String(ajustes[k]) === String(v) ? 'sel' : ''}" data-aj="${k}" data-v="${v}">${n}</button>`).join('')}</div>${dica ? `<small>${dica}</small>` : ''}</div>`; }

/* ====================== render e eventos ====================== */
function aplicar() {
  const t = TEMAS[ajustes.tema], r = document.documentElement.style;
  for (const [k, v] of Object.entries(t)) r.setProperty('--' + k, v);
  if (ajustes.bordasReforcadas) r.setProperty('--borda', t.bordaCampo);
  r.setProperty('--bwBloco', ajustes.bordasReforcadas ? '3px' : '2px');
  r.setProperty('--marca', '#B71C1C'); r.setProperty('--marcaTexto', ajustes.tema === 'escuro' ? '#F4F4F5' : '#B71C1C');
  r.setProperty('--largura', estado.tela === 'novo' ? '880px' : '1240px');
  r.colorScheme = ajustes.tema === 'escuro' ? 'dark' : 'light';
  const b = document.body.classList, cel = ajustes.celular || innerWidth < 768;
  b.toggle('cel', cel); b.toggle('simula-cel', ajustes.celular && innerWidth >= 768); b.toggle('editando', ajustes.editarTextos);
}
function render() {
  const foco = document.activeElement?.dataset?.k, ini = document.activeElement?.selectionStart;
  aplicar();
  const tela = estado.tela === 'lista' ? telaLista() : estado.tela === 'ficha' ? telaFicha() : telaNovo();
  document.getElementById('app').innerHTML = `${menu()}<div class="principal">${topo()}<main class="conteudo">${tela}</main>${inferior()}</div>`;
  painel();
  if (foco) { const el = document.querySelector(`[data-k="${CSS.escape(foco)}"]`); if (el) { el.focus(); try { el.setSelectionRange(ini, ini); } catch (e) {} } }
}
const ir = (tela, extra = {}) => { Object.assign(estado, { tela, menuAcoes: false }, extra); render(); scrollTo(0, 0); };
document.addEventListener('click', (ev) => {
  const ed = ev.target.closest('[data-ed]');
  if (ed) { if (ed.dataset.ed === 'salvar') textos[editId] = document.getElementById('texto-novo').value; if (ed.dataset.ed === 'original') delete textos[editId]; document.getElementById('camada-aviso').innerHTML = ''; guardar(); render(); return; }

  const aj = ev.target.closest('[data-aj]');
  if (aj) { const v = aj.dataset.v; ajustes[aj.dataset.aj] = v === 'true' ? true : v === 'false' ? false : v; guardar(); render(); return; }
  const el = ev.target.closest('[data-acao]'); if (!el) { if (estado.menuAcoes) { estado.menuAcoes = false; render(); } return; }
  const a = el.dataset.acao, d = el.dataset;
  switch (a) {
    case 'nada': aviso('No protótipo só estas três telas funcionam.'); return;
    case 'ir-lista': return ir('lista', { editandoId: null });
    case 'ir-ficha': return ir('ficha');
    case 'ir-novo': return ir('novo', { form: novoForm(), erros: {}, tentouSalvar: false, editandoId: null });
    case 'abrir': return ir('ficha', { id: d.id });
    case 'editar': { ev.stopPropagation(); const x = ALUNOS.find((y) => y.id === d.id); const [rua] = x.endereco.split(' · ');
      return ir('novo', { id: x.id, editandoId: x.id, erros: {}, tentouSalvar: false, form: { ...novoForm(), nome: x.nome, sexo: x.sexo[0], email: x.email, objetivo: x.objetivo, cpf: x.cpf, cep: '85800-000', logradouro: rua.split(',')[0], numero: '100', bairro: 'Centro', cidade: 'Cascavel', uf: 'PR', resp: String(x.resp), ciclo: String(x.ciclo) } }); }
    case 'situacao': estado.situacao = d.v; estado.marcados.clear(); break;
    case 'escopo': estado.escopo = d.v; estado.marcados.clear(); break;
    case 'selecionar': estado.selecionando = !estado.selecionando; estado.marcados.clear(); break;
    case 'marcar': ev.stopPropagation(); estado.marcados.has(d.id) ? estado.marcados.delete(d.id) : estado.marcados.add(d.id); if (!estado.selecionando) estado.selecionando = true; break;

      const id = 'n' + Date.now();
      ALUNOS.unshift(aluno(id, f.nome.trim(), { temAcesso: false, plano: null, ultimo: null, atualizacao: null, resp: Number(f.resp), email: f.email, objetivo: f.objetivo, cpf: f.cpf, sexo: { F: 'Feminino', M: 'Masculino', O: 'Outro' }[f.sexo] || 'Não informado', ciclo: Number(f.ciclo) || 30, endereco: f.logradouro ? `${f.logradouro}, ${f.numero} · ${f.bairro} · ${f.cidade}/${f.uf}` : '' }));
      aviso('Aluno criado. Para ele entrar no app, gere o convite em Acesso ao app.'); return ir('ficha', { id }); }
    case 'aj-abrir': ajAberto = true; break;

});
document.addEventListener('keydown', (ev) => {
  if (ev.target.id === 'texto-novo' && ev.key === 'Enter') { document.querySelector('[data-ed="salvar"]').click(); return; }
  if (ev.key === 'Enter' && ev.target.matches('.linha-aluno, .linha-pasta')) ev.target.click();
  if (ev.key === 'Escape') { if (ajAberto) { ajAberto = false; render(); } else if (estado.menuAcoes) { estado.menuAcoes = false; render(); } }
});
document.addEventListener('input', (ev) => {
  const t = ev.target;
  if (t.dataset.campoLista) { estado[t.dataset.campoLista] = t.value; estado.marcados.clear(); render(); return; }
  if (t.dataset.campoForm) { let v = t.value;
    if (t.dataset.campoForm === 'cpf') { const d = v.replace(/\D/g, '').slice(0, 11); v = d.replace(/^(\d{3})(\d)/, '$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1-$2'); }
    if (t.dataset.campoForm === 'cep') { const d = v.replace(/\D/g, '').slice(0, 8); v = d.length > 5 ? `${d.slice(0, 5)}-${d.slice(5)}` : d; }
    if (t.dataset.campoForm === 'uf') v = v.toUpperCase().replace(/[^A-Z]/g, '');
    estado.form[t.dataset.campoForm] = v; if (estado.tentouSalvar) estado.erros = validar(estado.form); render(); }
});
document.addEventListener('change', (ev) => { if (ev.target.dataset.campoForm === 'resp') estado.form.resp = ev.target.value; });
let editId = null;
function abrirEditor(el) {
  editId = el.dataset.t; const r = el.getBoundingClientRect();
  document.getElementById('camada-aviso').innerHTML = `<div class="editor-texto" style="top:${Math.min(r.bottom + 6, innerHeight - 150)}px;left:${Math.max(8, Math.min(r.left, innerWidth - 330))}px"><b>Editar texto</b>
    <input id="texto-novo" value="${esc(textos[editId] ?? PADROES[editId] ?? el.textContent)}"><small style="color:#52525B">Original: ${esc(PADROES[editId] || '')}</small>
    <div class="lb"><button class="forte" data-ed="salvar">Salvar</button><button data-ed="original">Voltar ao original</button><button data-ed="cancelar">Cancelar</button></div></div>`;
  const i = document.getElementById('texto-novo'); i.focus(); i.select();
}
addEventListener('resize', () => { clearTimeout(window.__r); window.__r = setTimeout(render, 120); });
render();
</script>
</body>
</html>
